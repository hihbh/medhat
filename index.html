};

Object.assign(ACT,{
  tmenu(){const e=document.querySelector('.tsh');if(e)e.classList.toggle('open')},
  addAsst(){
    const a=U.na||{},nm=(a.name||'').trim(),us=(a.user||'').trim(),pw=a.pw||'',lo=x=>String(x).toLowerCase();
    if(!us){toast('اكتب اسم مستخدم للمساعد');return}
    if(pw.length<6){toast('كلمة المرور يجب ألا تقل عن 6 أحرف');return}
    if(lo(us)==lo(S.auth.teacher.id)||(S.assistants||[]).some(x=>lo(x.user)==lo(us))||S.students.some(s=>[suser(s),puser(s)].some(u=>lo(u)==lo(us)))){toast('اسم المستخدم مستخدم بالفعل');return}
    const id=uid('a');(S.assistants=S.assistants||[]).push({id,name:nm||'مساعد',user:us,h:pwH('a',id,pw)});
    U.na={name:'',user:'',pw:''};save();toast('تمت إضافة المساعد');render()},
  asstPw(id){
    const p=((U.ap||{})[id])||'';if(p.length<6){toast('كلمة المرور يجب ألا تقل عن 6 أحرف');return}
    const a=(S.assistants||[]).find(x=>x.id==id);if(!a)return;
    a.h=pwH('a',a.k||a.id,p);a.d=0;U.ap[id]='';save();toast('تم تغيير كلمة المرور');render()},
  delAsstAsk(id){U.asDel=id||null;render()},
  delAsst(id){S.assistants=(S.assistants||[]).filter(a=>a.id!=id);U.asDel=null;save();toast('تم حذف المساعد');render()},
  saveAuth(){
    const a=U.ac||{},A=S.auth,lo=x=>String(x).toLowerCase();
    if(A.teacher.h!=pwH('t','t',a.cur||'')){toast('كلمة مرور المدرس الحالية غير صحيحة');return}
    const tid=String(a.tid!=null?a.tid:A.teacher.id).trim();
    if(!tid){toast('اسم المستخدم مطلوب');return}
    if((S.assistants||[]).some(x=>lo(x.user)==lo(tid))||S.students.some(s=>[suser(s),puser(s)].some(u=>lo(u)==lo(tid)))){toast('اسم المستخدم مستخدم لطالب أو مساعد');return}
    if(a.tpw&&a.tpw.length<6){toast('كلمة المرور يجب ألا تقل عن 6 أحرف');return}
    A.teacher.id=tid;if(a.tpw){A.teacher.h=pwH('t','t',a.tpw);A.teacher.d=0}
    U.ac={};save();toast('تم حفظ بيانات الدخول');render()}
});

/* ===== نتائج الألعاب: كل محاولة بدرجتها وأخطائها ===== */
function qAttemptRows(rs,showMiss){
  return rs.map((r,i)=>{const sc=r.score!=null?`${r.score} من ${r.total}`:`${r.pct}%`;
    const ms=showMiss&&r.miss&&r.miss.length?`<details style="margin:2px 0 6px"><summary class="small">الأخطاء (${r.miss.length})</summary>${r.miss.map(m=>`<div class="qm"><b>${bd(m.q)}</b><div class="small"><span class="muted">إجابتك:</span> ${bd(m.p||'—')} · <span class="muted">الصحيحة:</span> ${bd(m.a)}</div></div>`).join('')}</details>`:'';
    return `<div class="row sp small" style="padding:5px 0"><span>المحاولة ${i+1} · ${fd(r.date)}${i==0?' · <span class="muted">تُحتسب نقاطها</span>':''}</span><span class="row" style="gap:6px"><b>${sc}</b><span class="chip ${r.pct>=75?'ok':r.pct>=50?'warn':'bad'}">${r.pct}%</span></span></div>${ms}`}).join('');
}
function quizHist(sid,showMiss){
  const R=S.quizRes.filter(r=>r.sid==sid);
  if(!R.length)return `<div class="card"><h3>نتائج الألعاب</h3><p class="muted" style="margin:0">لم يلعب أي لعبة بعد.</p></div>`;
  const by={};R.forEach(r=>(by[r.qid]=by[r.qid]||[]).push(r));
  return `<div class="card"><h3>نتائج الألعاب</h3>${Object.keys(by).map(id=>{const q=S.quizzes.find(y=>y.id==id),a=by[id];return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="row sp"><b>${esc(q?q.title:'لعبة محذوفة')}</b><span class="chip">${a.length} محاولة</span></div>${qAttemptRows(a,showMiss)}</div>`}).join('')}</div>`;
}
const _exS=V.examsS;V.examsS=function(){return _exS.apply(this,arguments)+quizHist(me().sid,me().role=='student')};
const _qzT=V.quizzes;V.quizzes=function(){
  let h=_qzT.apply(this,arguments);
  const blocks=S.quizzes.map(q=>{const rs=S.quizRes.filter(r=>r.qid==q.id);if(!rs.length)return '';
    const ids=[...new Set(rs.map(r=>r.sid))];
    return `<details style="padding:6px 0;border-top:1px solid var(--line)"><summary><b>${esc(q.title)}</b> <span class="small muted">· ${ids.length} طالب · ${rs.length} محاولة</span></summary>${ids.map(id=>{const z=st(id);if(!z)return '';return `<div style="padding:6px 0 2px"><b class="small">${esc(z.name)}</b>${qAttemptRows(rs.filter(r=>r.sid==id),true)}</div>`}).join('')}</details>`}).join('');
  return h+`<div class="card"><h3>نتائج الطلاب في الألعاب</h3>${blocks||'<p class="muted" style="margin:0">لا توجد نتائج بعد.</p>'}</div>`;
};
const _pfQ=profile;profile=function(sid,emb){return _pfQ.apply(this,arguments)+(emb?'':quizHist(sid,true))};
Object.assign(EN,{'نتائج الألعاب':'Game results','لم يلعب أي لعبة بعد.':'No games played yet.','لعبة محذوفة':'Deleted game','نتائج الطلاب في الألعاب':'Students’ game results','لا توجد نتائج بعد.':'No results yet.','تُحتسب نقاطها':'points counted','الأخطاء':'Mistakes','إجابتك':'Your answer','الصحيحة':'Correct','النقاط تُحتسب من أول محاولة فقط':'Points are counted from the first attempt only'});
ENR.push([/^(\d+) محاولة$/,n=>`${n} attempts`],[/^المحاولة (\d+)$/,n=>`Attempt ${n}`],[/^(\d+) من (\d+)$/,(a,b)=>`${a} of ${b}`],[/^الأخطاء \((\d+)\)$/,n=>`Mistakes (${n})`],[/^المحاولة رقم (\d+): (\d+) من (\d+)( · النقاط تُحتسب من أول محاولة فقط)?$/,(a,b,c,d)=>`Attempt #${a}: ${b} of ${c}${d?' · points are counted from the first attempt only':''}`]);
