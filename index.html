<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handball Shot Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root{
  color-scheme:light dark;
  --bg:#E9EEF3;--card:#FFF;--fg:#141B24;--muted:#566372;--line:#2B3744;--line-soft:#93A0AD;
  --court:#E8EFF5;--court-2:#D8E3ED;--area:#C6D7E8;--hair:#D3DAE1;--field:#F3F6F9;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 10px 24px -14px rgba(20,27,36,.35);
  --accent:#17406B;--accent-ink:#FFF;--danger:#B42318;
  --l1:#C93030;--l2:#D26A00;--l3:#2E8B47;--l4:#0F8EA3;--l5:#2F5FD0;--l6:#8E44C2;--dot-ink:#FFF;
  --p:#C2185B;--p-ink:#FFF;--f:#141B24;--f-ink:#FFF;
  --font-display:"Barlow Condensed","Cairo","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Cairo","Segoe UI",system-ui,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1117;--card:#161D25;--fg:#E9EEF3;--muted:#9AA7B5;--line:#B7C4D1;--line-soft:#5A6876;
  --court:#1F2A35;--court-2:#18212A;--area:#29394A;--hair:#27323E;--field:#0F151B;--shadow:none;
  --accent:#8DB6E6;--accent-ink:#0B1520;--danger:#F97066;
  --l1:#F0706B;--l2:#F5A04A;--l3:#5CC47A;--l4:#46C6DA;--l5:#7C9CF7;--l6:#C28FF0;--dot-ink:#0E1318;
  --p:#F06292;--p-ink:#1A0710;--f:#E9EEF3;--f-ink:#0E1318;}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:20px 44px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
[dir=rtl] *{letter-spacing:0!important}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--font-display);font-size:36px;line-height:1.1;margin:0;font-weight:700}
.sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:64ch}
h2{font-family:var(--font-display);font-size:26px;margin:26px 0 12px;font-weight:700}
input,textarea,select{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--hair);border-radius:9px;padding:8px 11px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 13px var(--font-body);min-height:36px;padding:5px 13px;border:1px solid var(--hair);background:var(--card);color:var(--fg);border-radius:9px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[data-armed="1"]{border-color:var(--danger);color:var(--danger)}
.bar{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.bar .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.bar .grow{flex:1;min-width:150px}
.bar select,.bar input{height:40px;font-size:15px;color:var(--fg)}
.status{font-size:12px;color:var(--muted);margin-inline-start:auto}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0 0 16px;padding:0}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--hair);border-radius:999px;padding:5px 14px 5px 8px;font-size:13px;color:var(--muted);box-shadow:var(--shadow)}
[dir=rtl] .pill{padding:5px 8px 5px 14px}
.pill b{font-family:var(--font-display);font-size:20px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.g{width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--tc);color:var(--ti)}
.seg button[aria-pressed="true"] .g{background:var(--ti);color:var(--tc)}
.g.gs{border-radius:50%}.g.go{border-radius:5px;font-size:11px}.g.gp{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.g.gf{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:10px}
.idx{flex:none;width:22px;font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--muted);text-align:center}
input.num{width:70px;height:46px;text-align:center;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;padding:0;border:2px solid var(--line-soft);border-radius:10px}
input.pos{flex:1;height:46px;font-size:16px}
.rm{flex:none;height:46px}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(4,auto);gap:6px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--hair);border-radius:10px;background:var(--field);color:var(--fg);font:600 13.5px var(--font-body);min-height:40px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:var(--ti)}
.spacer{flex:1}
.lanes{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lanes>span{font-size:12.5px;font-weight:600;color:var(--muted);margin-inline-end:2px}
.lanes button{width:42px;height:42px;border-radius:50%;border:2px solid var(--lc);background:transparent;color:var(--lc);font:700 18px var(--font-display);cursor:pointer;padding:0}
.lanes button[aria-pressed="true"]{background:var(--lc);color:var(--dot-ink)}
.resrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.resrow>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.resrow button{min-height:38px;padding:4px 18px;border-radius:999px;border:2px solid var(--rc);background:transparent;color:var(--rc);font:600 14px var(--font-body);cursor:pointer}
.resrow button[aria-pressed="true"]{background:var(--rc);color:var(--dot-ink)}
.x.flip{font-size:15px;padding:0 4px}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:36px;background:var(--field);border-radius:10px;padding:4px 12px}
.dots{display:inline-flex;gap:5px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line-soft)}
.dots i.done{background:var(--fg);border-color:var(--fg)}
.dots i.cur{border-color:var(--accent);background:var(--accent)}
.hint{margin:0;font-size:13.5px;flex:1;min-width:0}
.court{display:block;width:100%;height:auto;background:var(--court);border-radius:10px;overflow:hidden;touch-action:manipulation;cursor:crosshair;direction:ltr;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.court text{font-family:var(--font-body)}
.court .dyn g{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.ln{fill:none;stroke:var(--line);stroke-width:2}
.ray{stroke:var(--line-soft);stroke-width:1.4;fill:none}
.notes{display:flex;flex-direction:column;gap:8px}
.notes-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--hair);padding-top:10px}
.notes-head b{font-family:var(--font-display);font-size:20px;line-height:1;font-weight:700}
.sum{font-size:12.5px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.45;padding:6px 0;border-bottom:1px solid var(--hair)}
.log li:last-child{border-bottom:0}
.log .t{flex:1;min-width:0}
.sw{flex:none;width:20px;height:20px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.sw.s{border-radius:50%;color:var(--dot-ink)}
.sw.o{border-radius:50%;background:var(--card);border:2px solid;font-size:10px}.sw.p{background:var(--p);color:var(--p-ink);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.sw.f{background:var(--f);color:var(--f-ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.x{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 6px}
.empty{color:var(--muted);font-size:13px;border-bottom:0!important}
textarea.note{width:100%;min-height:66px;resize:vertical}
.addrow{display:flex;justify-content:center;margin-top:18px}
/* summary */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.scard{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.shead{display:flex;align-items:baseline;gap:10px}
.shead b{font-family:var(--font-display);font-size:30px;line-height:1}
.shead span{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.stats div{background:var(--field);border-radius:9px;padding:6px 2px;font-size:11.5px;color:var(--muted);line-height:1.2}
.stats b{display:block;font-family:var(--font-display);font-size:24px;color:var(--fg)}
.cap{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;direction:ltr;border:3px solid var(--line);border-bottom:0;padding:4px;border-radius:6px 6px 0 0}
.gc{position:relative;height:40px;display:grid;place-items:center;background:var(--field);border-radius:6px;overflow:hidden}
.gc i{position:absolute;inset:0;background:var(--accent)}
.gc b{position:relative;font-family:var(--font-display);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--lc,var(--hair));border-radius:999px;padding:2px 10px 2px 3px;font-size:13px;font-variant-numeric:tabular-nums}
[dir=rtl] .chip{padding:2px 3px 2px 10px}
.chip em{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--lc,var(--muted));color:var(--dot-ink);font:700 12px var(--font-display)}
.chip.plain{padding:2px 12px;border-color:var(--hair)}
.chip.plain b{font-family:var(--font-display);font-size:16px;margin-inline-start:4px}
@media (max-width:520px){h1{font-size:30px}.seg{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.seg button{padding:6px 4px;font-size:12.5px}}

/* pdf export */
.shrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.shrow h2{margin:0}
.btn:disabled{opacity:.6;cursor:progress}
#pdfHost{position:fixed;left:-10000px;top:0;pointer-events:none}
#pdfRoot{width:740px;background:#fff;color:#141B24;font-family:var(--font-body);font-size:14px;line-height:1.5;
  --card:#fff;--fg:#141B24;--muted:#566372;--line:#2B3744;--line-soft:#93A0AD;--hair:#D3DAE1;--field:#F3F6F9;--accent:#17406B;--accent-ink:#fff;--danger:#B42318;
  --l1:#C93030;--l2:#D26A00;--l3:#2E8B47;--l4:#0F8EA3;--l5:#2F5FD0;--l6:#8E44C2;--dot-ink:#fff;--p:#C2185B;--p-ink:#fff;
  --court:#E8EFF5;--court-2:#D8E3ED;--area:#C6D7E8;--f:#141B24;--f-ink:#fff}
#pdfRoot{padding-bottom:6px}
#pdfRoot .pbanner{display:flex;align-items:center;justify-content:space-between;gap:16px;border-radius:16px;padding:22px 26px;color:#fff;
  background:linear-gradient(135deg,#0E2A48 0%,#17406B 55%,#2F5FD0 100%)}
#pdfRoot .pbanner small{display:block;font-size:13px;color:#BFD3EA;font-weight:600;margin-bottom:2px}
#pdfRoot .pbanner h1{font-size:32px;margin:0;color:#fff;line-height:1.25}
#pdfRoot .pdate{flex:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:#fff}
#pdfRoot .ptot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 18px}
#pdfRoot .ptot div{border:1px solid #D3DAE1;border-top:4px solid var(--tc);border-radius:12px;padding:10px 6px 9px;text-align:center;font-size:12.5px;font-weight:600;color:#566372;background:#fff}
#pdfRoot .ptot b{display:block;font-family:var(--font-display);font-size:32px;line-height:1.15;color:#141B24}
#pdfRoot .shead{align-items:center;gap:10px}
#pdfRoot .shead b{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border-radius:12px;background:#17406B;color:#fff;font-size:22px}
#pdfRoot .shead span{font-size:16px;font-weight:700;color:#141B24}
#pdfRoot .pnote{margin:0;font-size:12.5px;color:#566372;background:#F3F6F9;border-radius:8px;padding:7px 10px;white-space:pre-wrap}
#pdfRoot .notes-head b{font-size:17px}
#pdfRoot .log li{font-size:12px;padding:5px 0}
#pdfRoot .sw.p,#pdfRoot .sw.f{clip-path:none;border-radius:5px}
#pdfRoot .pstrip{display:flex;justify-content:space-between;gap:10px;background:#17406B;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;margin-bottom:12px}
#pdfRoot .pcard{border:1px solid #C9D2DB;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
#pdfRoot .prow{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;align-items:start}
#pdfRoot .psum{display:flex;flex-direction:column;gap:10px}
#pdfRoot .plab{font-family:var(--font-display);font-size:19px;font-weight:700;padding:12px 12px 0 0;border-top:1px solid #D3DAE1;border-inline-start:0}
#pdfRoot .pcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
#pdfRoot .pcols .chips{gap:5px}
#pdfRoot .pcols .chip{font-size:12px}
#pdfRoot .pfoot{margin-top:16px;padding-top:10px;border-top:1px solid #D3DAE1;text-align:center;font-size:11px;color:#8896A4}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <button type="button" class="btn" id="lang"></button>
  </header>

  <section class="bar" aria-label="Match">
    <div class="r">
      <label class="grow"><span data-i="match"></span><select id="sel"></select></label>
      <button type="button" class="btn pri" id="newm" data-i="newMatch" style="align-self:flex-end"></button>
    </div>
    <div class="r">
      <label class="grow" style="flex:2"><span data-i="matchName"></span><input id="mname" type="text" data-ph="matchPh"></label>
      <label class="grow"><span data-i="date"></span><input id="mdate" type="date"></label>
    </div>
    <div class="r">
      <button type="button" class="btn" id="exp" data-i="backup"></button>
      <button type="button" class="btn" id="imp" data-i="restore"></button>
      <input type="file" id="file" accept="application/json,.json" hidden>
      <button type="button" class="btn" id="clr" data-i="clearMatch"></button>
      <button type="button" class="btn" id="delm" data-i="delMatch"></button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
  </section>

  <ul class="pills">
    <li class="pill"><span class="g gs" style="--tc:var(--accent);--ti:var(--accent-ink)"></span><b id="t-s">0</b><span data-i="shots"></span></li>
    <li class="pill"><span class="g go" style="--tc:var(--danger);--ti:#fff">✕</span><b id="t-o">0</b><span data-i="outs"></span></li>
    <li class="pill"><span class="g gp" style="--tc:var(--p);--ti:var(--p-ink)">P</span><b id="t-p">0</b><span data-i="pens"></span></li>
    <li class="pill"><span class="g gf" style="--tc:var(--f);--ti:var(--f-ink)">F</span><b id="t-f">0</b><span data-i="fasts"></span></li>
  </ul>

  <main class="grid" id="grid"></main>
  <div class="addrow"><button type="button" class="btn pri" id="addp" data-i="addPlayer"></button></div>

  <div class="shrow"><h2 data-i="summary"></h2><button type="button" class="btn pri" id="pdfBtn" data-i="pdfBtn"></button></div>
  <div class="sgrid" id="sgrid"></div>

  <datalist id="positions"></datalist>
</div>

    };
    loadPdfLib(function (ok) {
      if (!ok) return done(false);
      var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      ready.then(function () {
        return buildPdfDom().then(function (root) {
          var m = cur();
          var fname = ((m.name || T('untitled')) + (m.date ? '-' + m.date : '')).replace(/[\\\/:*?"<>|]+/g, '-').trim() || 'summary';
          return window.html2pdf().set({
            margin: [8, 8, 10, 8],
            filename: fname + '.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0, scrollX: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['legacy'] }
          }).from(root).save();
        });
      }).then(function () { done(true); }, function (e) { console.error(e); done(false); });
    });
  });

  document.getElementById('lang').addEventListener('click', function () { store.lang = store.lang === 'ar' ? 'en' : 'ar'; save(); applyLang(); });

  document.getElementById('exp').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(store)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'handball-board-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById('imp').addEventListener('click', function () { document.getElementById('file').click(); });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result), ms = cleanMatches(d.matches, true);
        if (!ms.length) throw 0;
        ms.forEach(function (m) { store.matches.push(m); queuePush(m.id); });
        store.cur = ms[0].id; save(); renderBar(); buildAll(); statusEl.textContent = T('imported');
      } catch (err) { statusEl.textContent = T('badFile'); }
    };
    rd.readAsText(f); e.target.value = '';
  });

  // ---------- cloud sync (Firebase Firestore) ----------
  var FB_CONFIG = {
    apiKey: "AIzaSyB5xHtOySVF96ouNyvvvlZ6lO9fCj5zdjo",
    authDomain: "medhat-4430c.firebaseapp.com",
    projectId: "medhat-4430c",
    storageBucket: "medhat-4430c.firebasestorage.app",
    messagingSenderId: "1055866702851",
    appId: "1:1055866702851:web:ebc79bff69b8b5e5ea5236",
    measurementId: "G-DLD6FLLHSB"
  };
  function findM(id) { for (var i = 0; i < store.matches.length; i++) if (store.matches[i].id === id) return store.matches[i]; return null; }
  function isBlank(m) { return !m.name && m.cells.every(function (c) { return !c.num && !c.pos && !c.note && !c.events.length; }); }
  function setCloud(k) { statusEl.textContent = T(k); }
  function queuePush(id) {
    if (!colRef) return;
    clearTimeout(pushTimers[id]);
    pushTimers[id] = setTimeout(function () {
      var m = findM(id); if (!m) return;
      var slow = setTimeout(function () { setCloud('cloudPending'); }, 6000);
      colRef.doc(id).set({ name: m.name, date: m.date, updated: m.updated, data: JSON.stringify(m.cells) }).then(
        function () { clearTimeout(slow); setCloud('cloudSaved'); },
        function (e) { clearTimeout(slow); console.error(e); setCloud('cloudErr'); });
    }, 700);
  }
  function applyRemote(id, d) {
    var cs; try { cs = cleanCells(JSON.parse(d.data)); } catch (e) { return false; }
    var up = +d.updated || 0, m = findM(id);
    if (!m) { store.matches.push({ id: id, name: String(d.name || ''), date: String(d.date || ''), updated: up, cells: cs }); return 'other'; }
    if (up > m.updated) { m.name = String(d.name || ''); m.date = String(d.date || ''); m.updated = up; m.cells = cs; return m.id === store.cur ? 'cur' : 'other'; }
    return false;
  }
  function deferRebuild() {
    var ae = document.activeElement;
    if (ae && grid.contains(ae) && /INPUT|TEXTAREA/.test(ae.tagName)) { setTimeout(deferRebuild, 1500); return; }
    buildAll();
  }
  function initCloud() {
    if (!window.firebase || !firebase.firestore) return;
    var first = true;
    try {
      firebase.initializeApp(FB_CONFIG);
      var db = firebase.firestore();
      try { db.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
      colRef = db.collection('handball_matches');
      setCloud('cloudConn');
      colRef.onSnapshot(function (snap) {
        var needCur = false, needBar = false, ids = {};
        snap.docChanges().forEach(function (ch) {
          var id = ch.doc.id; ids[id] = 1;
          if (ch.doc.metadata.hasPendingWrites) return;
          if (ch.type === 'removed') {
            var i = store.matches.indexOf(findM(id));
            if (i >= 0 && store.matches.length > 1) { store.matches.splice(i, 1); if (store.cur === id) { store.cur = store.matches[0].id; needCur = true; } needBar = true; }
            return;
          }
          var d = ch.doc.data(), r = applyRemote(id, d);
          if (r) { needBar = true; if (r === 'cur') needCur = true; }
          else if (first) { var lm = findM(id); if (lm && lm.updated > (+d.updated || 0)) queuePush(id); }
        });
        if (first) {
          first = false;
          if (snap.size) {
            var before = store.cur;
            store.matches = store.matches.filter(function (m) { return ids[m.id] || !isBlank(m); });
            if (!findM(before)) {
              store.matches.sort(function (a, b) { return b.updated - a.updated; });
              store.cur = store.matches[0].id; needCur = true;
            }
            needBar = true;
          }
          store.matches.forEach(function (m) { if (!ids[m.id] && !isBlank(m)) queuePush(m.id); });
        }
        if (!store.matches.length) { var nm = newMatch(); store.matches.push(nm); store.cur = nm.id; needCur = true; needBar = true; }
        save();
        if (needBar) renderBar();
        if (needCur) deferRebuild();
        if (!snap.metadata.hasPendingWrites) setCloud('cloudSaved');
      }, function (e) { console.error(e); setCloud('cloudErr'); });
    } catch (e) { console.error(e); colRef = null; }
  }

  applyLang();
  initCloud();
})();
</script>
