<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR.ADAM</title>
<meta name="theme-color" content="#0a1a45">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{color-scheme:light;--bg:#f4f8fc;--card:#ffffff;--line:#c9d9ea;--text:#10243a;--mute:#5a6f86;--accent:#1553c7;--on:#fff;--gold:#2f7bff;--ok:#0f7f68;--bad:#d4343c;--warn:#c97a0a;--soft:#e7f0f9;--ink2:#0a2f55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(18,70,122,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(18,70,122,.07) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.65;font-size:17px}
h1,h2,h3,h4,.big,.stat b,.tile b,.bar b{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:800;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 0 5px var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:14px 12px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--accent);color:#fff;z-index:5;border-bottom:4px solid var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:980px;margin:0 auto;padding:10px 12px 4px}
.bar b{font-size:1.05rem}.bar small{display:block;color:rgba(255,255,255,.75);line-height:1.3}
header.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);box-shadow:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 12px 0;max-width:980px;margin:0 auto;scrollbar-width:none}
.tab{white-space:nowrap;padding:8px 14px;border:0;border-radius:8px 8px 0 0;background:transparent;color:rgba(255,255,255,.78);font-weight:700;cursor:pointer}
.tab.on{background:var(--gold);color:var(--ink2)}
.tab:hover:not(.on){background:rgba(255,255,255,.14);color:#fff}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.card h2,.card h3{margin:0 0 8px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1.5px solid var(--line);border-top:5px solid var(--accent);border-radius:8px;padding:10px 12px 12px}
.stat b{font-size:1.8rem;display:block}.stat span{color:var(--mute);font-size:.9rem}
.muted{color:var(--mute)}.small{font-size:.88rem}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.btn{border:2px solid var(--accent);background:var(--card);color:var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--accent);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--accent)}
.btn.pri{background:var(--accent);color:var(--on)}
.btn.bad{color:var(--bad);border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}.btn.sm{padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-block;padding:1px 10px;border:1.5px solid var(--mute);border-radius:6px;font-size:.84rem;font-weight:700;background:var(--soft);color:var(--mute);transform:rotate(-1.5deg)}
.chip.ok{background:#dff3ed;color:var(--ok);border-color:var(--ok)}.chip.bad{background:#fbe4e5;color:var(--bad);border-color:var(--bad)}.chip.warn{background:#fdf0d8;color:var(--warn);border-color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;cursor:pointer;font-weight:600}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:0;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;background:var(--soft)}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:700;margin:10px 0 4px}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
.av.lg{width:64px;height:64px;font-size:1.5rem;border-radius:16px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start}
.item:first-child{border-top:0}
.item:hover{background:var(--soft)}
.meter{height:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}
.bars{display:grid;gap:8px}.bars .row{flex-wrap:nowrap}.bars .lbl{width:92px;flex:none;font-size:.9rem}.bars .meter{flex:1;height:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:72px;padding:10px;border:2px solid var(--line);background:var(--card);border-radius:8px;font-weight:700;cursor:pointer}
.seg button.on{color:var(--on);border-color:transparent;box-shadow:2px 2px 0 rgba(16,36,58,.35)}
.seg button.on.ok{background:var(--ok)}.seg button.on.bad{background:var(--bad)}.seg button.on.warn{background:var(--warn)}
.ticket{position:relative;background:var(--card);border:2px solid var(--accent);border-radius:12px;margin:12px 0;overflow:visible;box-shadow:5px 5px 0 var(--accent)}
.ticket .top{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:2px dashed var(--line)}
.ticket .top::before,.ticket .top::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);top:calc(var(--cut,84px) - 10px)}
.ticket .top::before{inset-inline-start:-12px;clip-path:inset(0 0 0 50%)}.ticket .top::after{inset-inline-end:-12px;clip-path:inset(0 50% 0 0)}
.ticket .body{padding:14px 16px 16px}
.ticket h4{margin:14px 0 6px}
.qr{background:#fff;padding:6px;border-radius:6px;border:1.5px solid var(--line);width:92px;height:92px;flex:none}.qr svg{width:100%;height:100%;display:block}
.cam{background:#0a1626;border-radius:10px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center;color:#fff;margin-bottom:10px;border:2px solid var(--accent)}
.cam video{width:100%;height:100%;object-fit:cover}
.big{font-size:3rem}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{padding:12px;border:2px solid var(--line);background:var(--card);border-radius:8px;text-align:start;font-weight:700;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.good{background:var(--ok);color:var(--on);border-color:transparent}.opt.wrap-bad,.opt.wrong{background:var(--bad);color:var(--on);border-color:transparent}
.stars button{background:none;border:0;font-size:1.9rem;cursor:pointer;color:var(--line);padding:0 2px}.stars button.on{color:#f0b400}
.bub{max-width:82%;padding:8px 12px;border-radius:12px 12px 12px 2px;margin:6px 0;background:var(--soft);border:1.5px solid var(--line);white-space:pre-wrap}
.bub.me{margin-inline-start:auto;background:var(--accent);color:var(--on);border-color:var(--accent);border-radius:12px 12px 2px 12px}
.chat{max-height:340px;overflow:auto;padding:4px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:start;border-top:1.5px dashed var(--line)}th{color:var(--accent);font-weight:800;font-size:.9rem;border-top:0;border-bottom:2px solid var(--accent)}
.scroll{overflow-x:auto}
details{border-top:1.5px dashed var(--line);padding:8px 0}summary{cursor:pointer;font-weight:800}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:10px;padding:5px 0}.tl .d{width:54px;color:var(--mute);flex:none;font-size:.88rem}
.dot{width:12px;height:12px;border-radius:3px;margin-top:8px;flex:none;background:var(--mute);transform:rotate(45deg)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.ov{position:fixed;inset:0;background:rgba(10,30,55,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;border-top:5px solid var(--gold);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink2);color:#fff;border-bottom:3px solid var(--gold);padding:10px 18px;border-radius:8px;z-index:30;font-weight:700;display:none}
.login{max-width:440px;margin:5vh auto 0;padding:18px;background:var(--card);border:2px solid var(--accent);border-radius:14px;box-shadow:6px 6px 0 var(--accent)}
.login h1{font-size:1.6rem;margin:0 0 4px}
.login .card{box-shadow:none;border-style:dashed}
.cards4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qcard{border:2px dashed var(--accent);border-radius:10px;padding:10px;text-align:center;break-inside:avoid}
.qcard .qr{margin:0 auto 6px}
.lt{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:10px;margin-bottom:14px;border:1.5px solid var(--line)}
.lt button{flex:1;border:0;background:transparent;padding:10px;border-radius:8px;font-weight:800;color:var(--mute);cursor:pointer}
.lt button.on{background:var(--accent);color:#fff}
.hero{background-color:var(--accent);background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:20px 20px;color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border-bottom:5px solid var(--gold)}
.hero .av{border:3px solid var(--gold)}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border-radius:10px;padding:14px 8px;text-align:center;color:#fff;border:3px double rgba(255,255,255,.7);outline:3px solid transparent;box-shadow:4px 4px 0 rgba(16,36,58,.25)}
.tile .ic{font-size:2.2rem;line-height:1.2}.tile b{display:block;font-size:1.1rem}.tile small{display:block;opacity:.92}
.tile.ok{background:var(--ok)}.tile.bad{background:var(--bad)}.tile.warn{background:var(--warn)}.tile.none{background:var(--soft);color:var(--mute);border-color:var(--line);box-shadow:none}
.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:1.05rem;border-radius:10px;margin-bottom:14px}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:8px;background:var(--soft);margin-bottom:8px;border-inline-start:5px solid var(--accent)}
.alert.ok{border-color:var(--ok)}.alert.bad{border-color:var(--bad)}.alert.warn{border-color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
@media print{.noprint,.credit,header.top,#toast{display:none!important}main{display:none}.ov{position:static;background:none;display:block}.sheet{max-height:none;overflow:visible;padding:0;border:0}body{background:#fff;color:#000}}

/* ===== Luxe calm theme (student / parent / login) ===== */
body.lux{--bg:#f3f7fd;--card:#ffffff;--line:#dbe5f3;--text:#0b1220;--mute:#5b6b82;--accent:#1553c7;--on:#fff;--gold:#2f7bff;--ok:#1f8a5b;--bad:#d13a4a;--warn:#b7822e;--soft:#eaf1fc;--ink2:#0a1020;background-color:var(--bg);background-image:radial-gradient(800px 380px at 100% -8%,rgba(47,123,255,.16),transparent 65%),radial-gradient(700px 400px at -10% 105%,rgba(21,83,199,.1),transparent 65%);background-size:auto;background-attachment:fixed;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16.5px;line-height:1.85}
body.lux :is(h1,h2,h3,h4,.big,.stat b,.tile b,.bar b){font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:700}
body.lux h2{font-size:1.75rem;margin:0 0 6px}body.lux h3{font-size:1.28rem}
body.lux .wrap{max-width:720px;padding:22px 18px 124px}
body.lux header.top{background:rgba(243,247,253,.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);border-bottom:1px solid var(--line)}
body.lux .bar{max-width:720px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:12px}
.mono,.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:#ffffff;flex:none}
.logo{width:68px;height:68px;border-radius:24px;margin:0 auto 16px}
body.lux .bar b{font-size:1.25rem;color:var(--accent)}body.lux .bar small{color:var(--mute)}
body.lux header.top .btn{background:transparent;color:var(--accent);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
body.lux .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 18px 40px -28px rgba(10,16,32,.45)}
body.lux .card h3{margin:0 0 10px}
body.lux .btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:10px 22px;min-height:44px;box-shadow:none;font-weight:600;transition:background .2s,transform .2s}
body.lux .btn:hover{background:var(--soft)}body.lux .btn:active{transform:scale(.98);box-shadow:none}
body.lux .btn.pri{background:var(--accent);color:#fff;box-shadow:0 10px 22px -12px rgba(10,16,32,.75)}
body.lux .btn.pri:hover{background:var(--ink2)}
body.lux .btn.sm{padding:6px 16px;min-height:36px;font-size:.9rem}
body.lux .btn[data-act=back]{border-color:transparent;color:var(--mute);padding-inline:8px}
body.lux .cta{width:100%;margin:6px 0 20px;min-height:56px;font-size:1.08rem;display:flex}
body.lux :focus-visible{outline:2px solid var(--gold);outline-offset:3px;box-shadow:none}
body.lux .hero{background:linear-gradient(150deg,#1553c7,#0a1a45);border:0;border-radius:28px;padding:28px 24px;margin-bottom:18px;color:#f3f7fd;position:relative;overflow:hidden;box-shadow:0 26px 46px -28px rgba(10,16,32,.85),inset 0 0 0 1px rgba(47,123,255,.45)}
body.lux .hero::after{content:"";position:absolute;inset-inline-start:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:1px solid rgba(47,123,255,.35);box-shadow:0 0 0 30px rgba(47,123,255,.06)}
body.lux .hero>*{position:relative;z-index:1}
body.lux .hero h2{font-size:2.4rem;margin:0;color:#fff;line-height:1.3}
.eyebrow{display:block;font-size:.86rem;letter-spacing:.04em;color:#a9c9ff}.eyebrow.dark{color:var(--gold);margin-bottom:2px}
.hsub{margin:2px 0 20px;color:rgba(243,247,253,.78)}
.xp{color:rgba(243,247,253,.88)}.xp .meter{background:rgba(255,255,255,.15);margin-top:8px}
body.lux .meter{height:8px;border:0;border-radius:99px;background:var(--soft)}
body.lux .meter i{background:linear-gradient(90deg,#2f7bff,#8db9ff);border-radius:99px}
body.lux .stt{gap:14px;margin-bottom:16px}
body.lux .tile{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:start;display:flex;flex-direction:column;gap:2px;box-shadow:0 18px 40px -30px rgba(10,16,32,.5);outline:0}
.tile .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin-bottom:10px;background:var(--soft);color:var(--mute)}
.tile.ok .ico{background:rgba(31,138,91,.14);color:var(--ok)}.tile.bad .ico{background:rgba(209,58,74,.13);color:var(--bad)}.tile.warn .ico{background:rgba(183,130,46,.16);color:var(--warn)}
body.lux .tile small{color:var(--mute);font-size:.82rem}body.lux .tile b{font-size:1.55rem;color:var(--ink2)}
.tile em{font-style:normal;font-size:.85rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.lux .grid{gap:12px;grid-template-columns:repeat(2,1fr)}
body.lux .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
body.lux .stat b{font-size:2.2rem;color:var(--accent)}
body.lux .chip{transform:none;border:0;border-radius:99px;padding:2px 13px;background:var(--soft);color:var(--mute);font-weight:600}
body.lux .chip.ok{background:rgba(31,138,91,.13);color:var(--ok)}body.lux .chip.bad{background:rgba(209,58,74,.12);color:var(--bad)}body.lux .chip.warn{background:rgba(183,130,46,.15);color:var(--warn)}
body.lux .item{padding:16px 4px;border-top:1px solid var(--line)}
body.lux .item::after{content:"‹";color:var(--gold);font-size:1.7rem;line-height:1;margin-inline-start:4px}
body.lux .item:hover{background:transparent}
body.lux .alert{background:var(--soft);border-radius:16px;border-inline-start:3px solid var(--accent);padding:14px 16px}
body.lux .alert.ok{border-color:var(--ok)}body.lux .alert.bad{border-color:var(--bad)}body.lux .alert.warn{border-color:var(--warn)}
body.lux .dot{border-radius:50%;transform:none;width:9px;height:9px;margin-top:11px}
body.lux details{border-top:1px solid var(--line)}
body.lux :is(input[type=text],input[type=password],input[type=number],input[type=date],select,textarea){border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 16px}
body.lux :is(input[type=text],input[type=password],select,textarea):focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 4px rgba(47,123,255,.18)}
body.lux .opts{gap:10px}
body.lux .opt{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff;font-weight:500}
body.lux .opt:hover{border-color:var(--gold);background:var(--soft)}
body.lux .opt.good{background:var(--ok);color:#fff}body.lux .opt.wrong{background:var(--bad);color:#fff}
body.lux .big{font-size:4.2rem;color:var(--accent);line-height:1.2}
body.lux .stars button.on{color:var(--gold)}
body.lux .bub{border-radius:20px 20px 20px 6px;background:var(--soft);border:0;padding:10px 16px}
body.lux .bub.me{background:var(--accent);color:#fff;border-radius:20px 20px 6px 20px}
.sect{margin:28px 4px 14px;font-size:1.35rem;color:var(--accent);display:flex;align-items:center;gap:12px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.bnav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;display:flex;gap:2px;padding:7px;background:var(--ink2);border-radius:26px;box-shadow:0 20px 40px -12px rgba(10,16,32,.6);z-index:10}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:56px;border:0;border-radius:20px;background:transparent;color:rgba(243,247,253,.62);font-size:.74rem;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.bnav button.on{background:rgba(47,123,255,.2);color:#a9c9ff}
.rk{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid var(--line)}.rk:first-child{border-top:0}
.rk.me{background:var(--soft);border-radius:16px;border-color:transparent;padding-inline:12px}
.rk>b{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:1.3rem;color:var(--accent)}
.no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:700;background:var(--soft);color:var(--mute);flex:none}
.no.n1{background:#dbe7ff;color:#0a3a9a}.no.n2{background:#e9eef7;color:#4a5a72}.no.n3{background:#e6ecf7;color:#33415c}
body.lux .av{background:var(--soft)!important;color:var(--accent);border:1px solid var(--line);border-radius:50%;font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:1.25rem}
body.lux .av.lg{font-size:1.9rem}
body.lux .hero .av{background:rgba(255,255,255,.1)!important;color:#fff;border-color:rgba(47,123,255,.6)}
body.lux .login{max-width:440px;margin:7vh 16px 0;margin-inline:auto;padding:36px 26px;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:0 34px 64px -36px rgba(10,16,32,.6)}
body.lux .login h1{font-size:2.1rem;color:var(--accent);margin:0 0 6px}
body.lux .login .card{box-shadow:none;background:transparent;padding:18px;margin:18px 0 8px}
body.lux .lt{background:var(--soft);border:0;border-radius:99px;padding:5px}
body.lux .lt button{border-radius:99px;font-weight:600}body.lux .lt button.on{background:var(--accent);color:#fff}
body.lux #toast{background:var(--ink2);border:0;border-radius:99px;bottom:calc(98px + env(safe-area-inset-bottom,0px));padding:12px 24px;font-weight:500}

body.lux details:not(:first-of-type){display:none}
.hb{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--accent);display:grid;place-items:center;cursor:pointer;font-weight:600;font-size:.82rem;padding:0}
.ib.on{background:var(--accent);color:#fff}.ib:hover{background:var(--soft)}.ib.on:hover{background:var(--accent)}
.langbtn{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));inset-inline-end:16px;background:var(--card)}
[dir=ltr] body.lux .item::after{content:"›"}
.wk{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:start;color:inherit;font:inherit}
button.wk{cursor:pointer}.wk:first-child{border-top:0}
.wd{width:52px;height:56px;border-radius:16px;background:var(--soft);display:grid;place-content:center;text-align:center;flex:none;line-height:1.2}
.wd b{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:1.45rem;color:var(--accent)}.wd small{font-size:.72rem;color:var(--mute)}
.sc{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:2.1rem;color:var(--accent);line-height:1}.sc span{font-size:1rem;color:var(--mute)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
body.lux .grid .stat b{font-size:1.9rem}body.lux .grid .stat span{font-size:.82rem}
.fd{font-size:.82rem;color:var(--gold);font-weight:600;letter-spacing:.04em;margin:16px 0 4px}
.fe{display:flex;align-items:center;gap:12px;padding:9px 0}
.fe small{display:block;color:var(--mute);line-height:1.3}.fe b{font-weight:600}
.fi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--mute);flex:none}
.fi.ok{background:rgba(31,138,91,.14);color:var(--ok)}.fi.bad{background:rgba(209,58,74,.13);color:var(--bad)}.fi.warn{background:rgba(183,130,46,.16);color:var(--warn)}


/* ===== home hub + attendance + exam images ===== */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.hbtn{appearance:none;border:0;border-radius:26px;padding:18px;min-height:172px;display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:4px;cursor:pointer;color:#fff;font:inherit;box-shadow:0 22px 40px -26px rgba(10,16,32,.8);transition:transform .15s}
.hbtn:active{transform:scale(.97)}
.hbtn .hi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:rgba(255,255,255,.17);margin-bottom:auto}
.hbtn b{font-size:1.45rem;font-weight:800;line-height:1.3}
.hbtn small{opacity:.86;font-size:.86rem;line-height:1.5}
.hbtn.c1{background:linear-gradient(150deg,#3a86ff,#1553c7)}
.hbtn.c2{background:linear-gradient(150deg,#1d2744,#0a1020)}
.hbtn.c3{background:linear-gradient(150deg,#1553c7,#0a2a6b)}
.hbtn.c4{background:#fff;color:#0a1020;border:2px solid var(--accent)}
.hbtn.c4 .hi{background:var(--soft);color:var(--accent)}
.hbtn.c4 small{color:var(--mute);opacity:1}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.sub2 .btn{width:100%;justify-content:center;text-align:center}
.qrbig{width:210px;height:210px;margin:0 auto;background:#fff;padding:12px;border:1px solid var(--line);border-radius:22px}
.qrbig svg{width:100%;height:100%;display:block}
.exi{width:100%;max-height:280px;object-fit:cover;border-radius:16px;border:1px solid var(--line);margin:12px 0 4px;display:block;cursor:zoom-in;background:#fff}
.zimg{max-width:100%;max-height:82vh;border-radius:14px;background:#fff;display:block;margin:0 auto}
.yn{display:flex;align-items:center;gap:14px}
.yn .fi{width:52px;height:52px;border-radius:50%}

/* ===== redesign: inner pages, lesson, ID card ===== */
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none;position:relative}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.ring>div{position:relative;text-align:center;line-height:1.15}
.ring b{font-size:1.3rem;color:var(--ink2);display:block;font-weight:800}
.ring small{color:var(--mute);font-size:.72rem}
.ring.lg{width:104px;height:104px}.ring.lg b{font-size:1.6rem}
.idc{border-radius:28px;overflow:hidden;color:#fff;background:linear-gradient(150deg,#1553c7 0%,#0a1a45 62%,#0a1020 100%);box-shadow:0 28px 50px -30px rgba(10,16,32,.9);margin-bottom:16px}
.idc-h{display:flex;align-items:center;gap:12px;padding:18px 20px 6px}
.idc-h b{display:block;font-size:1.1rem}.idc-h small{display:block;opacity:.75}
.idc-b{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px 18px;flex-wrap:wrap}
.idc-i{flex:1;min-width:150px}
.idc-l{font-size:.78rem;opacity:.7;margin-top:10px;letter-spacing:.04em}
.idc-n{font-size:1.25rem;font-weight:800;line-height:1.4}
.idc-id{font-size:2.3rem;font-weight:800;line-height:1.1;letter-spacing:.06em;text-align:start}
.idc-u{font-size:1.05rem;font-weight:700;text-align:start}
.idc-q{appearance:none;border:0;background:#fff;border-radius:20px;padding:10px;width:148px;height:148px;flex:none;cursor:zoom-in;margin-inline:auto}
.idc-q svg{width:100%;height:100%;display:block}
.idc-f{background:rgba(255,255,255,.1);padding:10px 20px;font-size:.84rem;opacity:.95;border-top:1px solid rgba(255,255,255,.14)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.mini3 div{background:var(--soft);border-radius:16px;padding:10px 4px;text-align:center}
.mini3 b{display:block;font-size:1.4rem;color:var(--accent)}.mini3 span{font-size:.78rem;color:var(--mute)}
.lhero{background:linear-gradient(150deg,#3a86ff,#1553c7 55%,#0a1a45);color:#fff;border-radius:28px;padding:24px 22px;margin-bottom:16px;box-shadow:0 26px 46px -30px rgba(10,16,32,.85)}
.lhero h2{color:#fff;margin:4px 0 6px;font-size:1.9rem;line-height:1.35}
.lhero p{margin:0 0 10px;opacity:.88}
.lhero .eyebrow{color:#cfe0ff}
.lchips{display:flex;gap:6px;flex-wrap:wrap}.lchips span{background:rgba(255,255,255,.18);border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:600}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sech h3{margin:0!important;font-size:1.15rem!important}
.sech .fi{width:36px;height:36px;border-radius:12px;background:var(--soft);color:var(--accent)}
.notes{white-space:pre-wrap;line-height:2;border-inline-start:3px solid var(--accent);padding:2px 14px;background:var(--soft);border-radius:4px 14px 14px 4px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px;cursor:pointer;color:inherit;font:inherit;box-shadow:0 16px 34px -28px rgba(10,16,32,.6);transition:transform .12s}
.lrow:active{transform:scale(.98)}
.lrow::after{content:"‹";color:var(--accent);font-size:1.7rem;line-height:1}
[dir=ltr] .lrow::after{content:"›"}
.lrow .wd{background:var(--accent)}.lrow .wd b,.lrow .wd small{color:#fff}
.lrow .chip{margin-inline-end:4px}
.hwr .fi{width:44px;height:44px;border-radius:50%}

/* ===== teacher theme ===== */
body.tch{--bg:#eef3fb;--card:#fff;--line:#d9e3f3;--text:#0b1220;--mute:#5b6b82;--accent:#1553c7;--gold:#2f7bff;--soft:#eaf1fc;--ink2:#0a1020;background-color:var(--bg);background-image:radial-gradient(700px 300px at 0 -10%,rgba(21,83,199,.14),transparent 70%),radial-gradient(600px 300px at 100% 0,rgba(47,123,255,.10),transparent 70%);background-attachment:fixed}
body.tch header.top{background:linear-gradient(120deg,#0a1020,#1553c7);border-bottom:0;box-shadow:0 10px 30px -14px rgba(10,16,32,.7)}
body.tch .tabs{gap:6px;padding:0 10px 10px}
body.tch .tab{border-radius:999px;padding:7px 16px;background:rgba(255,255,255,.12);color:#fff;border:0}
body.tch .tab.on{background:#fff;color:var(--accent)}
body.tch .card{border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 32px -22px rgba(10,16,32,.5);padding:18px}
body.tch .stat{border:1px solid var(--line);border-top:0;border-radius:16px;background:linear-gradient(160deg,#fff,#eaf1fc);box-shadow:0 10px 24px -20px rgba(10,16,32,.6)}
body.tch .btn{border-radius:999px;border:1px solid var(--accent);box-shadow:none;padding:8px 18px}
body.tch .btn.pri{background:linear-gradient(120deg,#1553c7,#3b82f6);border-color:transparent;box-shadow:0 8px 18px -10px rgba(21,83,199,.8)}
body.tch .btn.bad{border-color:var(--bad);box-shadow:none}
body.tch .chip{transform:none;border-radius:999px}
body.tch .item{border-top:1px solid var(--line)}
body.tch input[type=text],body.tch input[type=password],body.tch input[type=number],body.tch input[type=date],body.tch select,body.tch textarea{border:1px solid var(--line);border-radius:12px;background:#fff}
body.tch .sheet{border-top:0;border-radius:24px 24px 0 0}
body.tch .meter{border:0;border-radius:99px}body.tch .meter i{background:linear-gradient(90deg,#1553c7,#7fb0ff)}
/* ===== protected video ===== */
.vwrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;width:100%;user-select:none;-webkit-user-select:none}
.vwrap:fullscreen{border-radius:0;aspect-ratio:auto}
.vwrap video{width:100%;height:100%;display:block;background:#000}
.vwrap .vmsg{position:absolute;inset:0;display:grid;place-items:center;color:#cbd5e1;text-align:center;padding:12px}
.wm{position:absolute;pointer-events:none;z-index:3;font:700 .95rem/1 system-ui,sans-serif;letter-spacing:.08em;color:rgba(200,200,200,.34);text-shadow:0 0 2px rgba(0,0,0,.3);transition:left 14s ease-in-out,top 14s ease-in-out;direction:ltr;white-space:nowrap}
.vfs{position:absolute;z-index:4;top:8px;inset-inline-end:8px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;padding:5px 10px;cursor:pointer}
body,button,input,select,textarea{font-family:'Cairo',system-ui,sans-serif}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
img,video,svg{max-width:100%}
.item,.lrow,.wk{min-width:0}
.grow b,.grow div{overflow-wrap:anywhere}
@media (max-width:420px){
 body.lux{font-size:15.5px}
 body.lux .wrap{padding:16px 12px 120px}
 body.lux .hero h2{font-size:1.9rem}
 body.lux .card{padding:16px;border-radius:18px}
 .hbtn{min-height:140px;padding:14px;border-radius:22px}
 .hbtn b{font-size:1.2rem}
 .hub,.sub2{gap:10px}
 .bnav button{font-size:.68rem}
 .sheet{padding:14px}
 .login{margin:4vh 12px 0!important;padding:26px 18px!important}
}
@media (min-width:900px){
 body.lux .wrap,body.lux .bar{max-width:820px}
 .bnav{max-width:620px}
}
@media (hover:none){.btn:hover{background:inherit}}

/* ===== v2: ملفات PDF + التقرير الشهري ===== */
.pfr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pfr:first-child{border-top:0}
.pfr .grow{min-width:140px}
.pfa{display:flex;gap:6px;flex-wrap:wrap}
#rpov .sheet{width:100%}
.credit{display:flex;justify-content:center;align-items:center;padding:7px 12px;background:#0a1a45;color:#fff;font-size:.9rem;font-weight:800;text-align:center;letter-spacing:.02em}
.lt button{padding:10px 4px;font-size:.95rem}
.pwrow{display:flex;flex-direction:column}
.pwrow .eye{display:inline-flex;align-items:center;gap:6px;align-self:flex-end;margin-top:8px;border:1.5px solid var(--line);background:var(--soft);color:var(--accent);font-weight:700;font-size:.88rem;line-height:1;cursor:pointer;padding:7px 13px;border-radius:999px;transition:background .15s,border-color .15s}
.pwrow .eye:hover{border-color:var(--accent);background:#fff}
.pwrow .eye:active{transform:scale(.97)}
.pwrow .eye svg{flex:none}
.warnbox{background:#fdf0d8;border:1.5px solid var(--warn);color:#7a4a05;border-radius:10px;padding:8px 12px;font-size:.9rem;margin:8px 0}

/* ===== اللعبة: شكل وانيميشن مختلف لكل سؤال ===== */
.qx{--qa:#1553c7;--qb:#3a86ff;--oan:qOptUp;border-radius:26px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 22px 44px -30px rgba(10,16,32,.7);margin-bottom:16px}
.qx .qhead{position:relative;overflow:hidden;color:#fff;padding:20px 20px 24px;background:linear-gradient(145deg,var(--qa),var(--qb))}
.qx .qhead::after{content:"";position:absolute;inset-inline-end:-50px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.qx .qhead>*{position:relative;z-index:1}
.qx .qmeta{display:flex;align-items:center;gap:10px;font-weight:700;opacity:.95}
.qx .qnum{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-size:1.2rem;font-weight:800}
.qx .qprog{height:8px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.qx .qprog i{display:block;height:100%;background:#fff;border-radius:99px}
.qx .qtext{color:#fff;font-size:1.45rem;line-height:1.6;margin:16px 0 0}
.qx .qopts{display:grid;gap:10px;padding:16px;grid-template-columns:1fr}
.qx .qfoot{padding:0 16px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
body .qx .qopt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--text);font-weight:700;text-align:start;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
body .qx .qopt:hover{border-color:var(--qa);background:var(--soft)}
body .qx .qopt:active{transform:scale(.97)}
.qx .ql{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--qa)}
body .qx .qopt.good{background:var(--ok);border-color:var(--ok);color:#fff}
body .qx .qopt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
body .qx .qopt.good .ql,body .qx .qopt.wrong .ql{background:rgba(255,255,255,.28)}
.qx.done .qopt{pointer-events:none}
.qx.done .qopt:not(.good):not(.wrong){opacity:.5}
/* 6 أشكال تتكرر */
.qx.qv0{--qa:#1553c7;--qb:#3a86ff;--oan:qOptUp}
.qx.qv0 .qopts{grid-template-columns:1fr 1fr}
.qx.qv1{--qa:#0a3a9a;--qb:#2f7bff;--oan:qOptPop}
.qx.qv1 .qopt{border-radius:999px}
.qx.qv2{--qa:#1553c7;--qb:#7fb0ff;--oan:qOptFlip}
.qx.qv2 .qopts{grid-template-columns:1fr 1fr}
.qx.qv2 .qopt{flex-direction:column;justify-content:center;text-align:center;border-radius:22px;padding:18px 10px;min-height:96px}
.qx.qv3{--qa:#243b7a;--qb:#5b8def;--oan:qOptSide}
.qx.qv3 .qopt{border-radius:14px;border-inline-start:8px solid var(--qa)}
.qx.qv4{--qa:#0a1020;--qb:#243b7a;--oan:qOptDrop}
.qx.qv4 .qopts{grid-template-columns:1fr 1fr}
.qx.qv4 .ql{background:#2f7bff;color:#fff}
.qx.qv5{--qa:#1b7f4b;--qb:#6fd68f;--oan:qOptBlur}
.qx.qv5 .qopt{border-radius:10px 26px 10px 26px}
@media (max-width:420px){.qx.qv0 .qopts,.qx.qv4 .qopts{grid-template-columns:1fr}.qx .qtext{font-size:1.25rem}}
@media (prefers-reduced-motion:no-preference){
 .qx.fresh.qv0{animation:qSlideR .55s cubic-bezier(.2,.9,.3,1) both}
 .qx.fresh.qv1{animation:qPop .65s cubic-bezier(.2,1.4,.4,1) both}
 .qx.fresh.qv2{animation:qFlip .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:top center}
 .qx.fresh.qv3{animation:qDrop .75s cubic-bezier(.3,1.5,.5,1) both}
 .qx.fresh.qv4{animation:qSpin .7s cubic-bezier(.2,.9,.3,1) both}
 .qx.fresh.qv5{animation:qSlideL .6s ease-out both}
 .qx.fresh .qnum{animation:qBadge .7s .25s cubic-bezier(.2,1.6,.4,1) both}
 .qx.fresh .qtext{animation:qTxt .6s .2s ease-out both}
 .qx .qhead::after{animation:qFloat 5s ease-in-out infinite}
 .qx.fresh .qopt{opacity:0;animation:var(--oan) .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.35s + var(--i)*.12s)}
 .qx .qopt.good{animation:qPulse .6s ease}
 .qx .qopt.wrong{animation:qShake .5s ease}
 .qx .qfoot .btn.pri{animation:qUp .4s ease both}
 @keyframes qSlideR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
 @keyframes qSlideL{from{opacity:0;transform:translateX(-70px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
 @keyframes qPop{0%{opacity:0;transform:scale(.55) rotate(-5deg)}100%{opacity:1;transform:none}}
 @keyframes qFlip{from{opacity:0;transform:perspective(700px) rotateX(-80deg)}to{opacity:1;transform:perspective(700px) rotateX(0)}}
 @keyframes qDrop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
 @keyframes qSpin{from{opacity:0;transform:rotate(-10deg) scale(.8) translateY(30px)}to{opacity:1;transform:none}}
 @keyframes qBadge{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:none}}
 @keyframes qTxt{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 @keyframes qFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,16px)}}
 @keyframes qOptUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
 @keyframes qOptPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
 @keyframes qOptFlip{from{opacity:0;transform:perspective(500px) rotateY(90deg)}to{opacity:1;transform:perspective(500px) rotateY(0)}}
 @keyframes qOptSide{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
 @keyframes qOptDrop{from{opacity:0;transform:translateY(-34px) scale(.9)}to{opacity:1;transform:none}}
 @keyframes qOptBlur{from{opacity:0;transform:scale(1.15);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
 @keyframes qPulse{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
 @keyframes qShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
 @keyframes qUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

.hub.h3 .hbtn:last-child{grid-column:1/-1;min-height:120px}
/* ===== حركة الأرقام والصفحات ===== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}

function attStats(sid){const a=S.att.filter(x=>x.sid==sid&&(!since(sid)||x.date>=since(sid)));const n=a.length,p=a.filter(x=>x.status=='present').length,l=a.filter(x=>x.status=='late').length,ab=a.filter(x=>x.status=='absent').length;return{n,p,l,ab,pct:n?Math.round((p+l)/n*100):0}}
function hwStats(sid){const past=hwFor(sid).filter(h=>h.due<=today());let sum=0;past.forEach(h=>{const s=sub(sid,h.id);const k=s?s.status:'missing';sum+=k=='done'?1:(k=='late'||k=='partial')?.5:0});return{total:past.length,pct:past.length?Math.round(sum/past.length*100):0}}
function examList(sid){return S.examScores.filter(x=>x.sid==sid).map(x=>{const e=S.exams.find(y=>y.id==x.eid);return e?{e,score:x.score,pct:Math.round(x.score/e.max*100)}:null}).filter(Boolean).sort((a,b)=>a.e.date.localeCompare(b.e.date))}
function examStats(sid){const l=examList(sid);return{list:l,pct:l.length?Math.round(l.reduce((s,x)=>s+x.pct,0)/l.length):0}}
function xp(sid){let x=0;S.att.filter(a=>a.sid==sid).forEach(a=>x+=a.status=='present'?10:a.status=='late'?5:0);
  S.hwSub.filter(h=>h.sid==sid).forEach(h=>x+=h.status=='done'?20:(h.status=='late'||h.status=='partial')?10:0);
  examList(sid).forEach(e=>x+=e.pct>=90?30:e.pct>=75?15:5);
  const seenQ={};S.quizRes.filter(q=>q.sid==sid).forEach(q=>{if(seenQ[q.qid])return;seenQ[q.qid]=1;x+=10+(q.pct>=90?10:0)});return x}

function lvlBar(x){const T=[0,150,300,500];
  if(x>=500)return '<div class="xp" style="margin-top:14px"><span class="small">وصلت لأعلى مستوى</span><div class="meter"><i style="width:100%"></i></div></div>';
  const i=T.findIndex((t,k)=>x<T[k+1]),a=T[i],b=T[i+1];
  return `<div class="xp" style="margin-top:14px"><span class="small">${b-x} نقطة للمستوى التالي</span><div class="meter"><i style="width:${Math.round((x-a)/(b-a)*100)}%"></i></div></div>`}
function needs(sid){const out=[];const a=S.att.filter(x=>x.sid==sid&&(!since(sid)||x.date>=since(sid))).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,4);const ab=a.filter(x=>x.status=='absent').length;if(ab>=2)out.push('غاب '+ab+' حصص من آخر '+a.length);
  const past=hwFor(sid).filter(h=>h.due<=today()).sort((x,y)=>y.due.localeCompare(x.due)).slice(0,2);const miss=past.filter(h=>{const s=sub(sid,h.id);return !s||s.status=='missing'}).length;if(past.length>=2&&miss>=2)out.push('لم يسلّم آخر واجبين');
  const e=examList(sid);if(e.length>=2&&e[e.length-1].pct<=e[e.length-2].pct-15)out.push('انخفضت درجاته في آخر امتحان');return out}

V.dash=()=>{
  const t=today(),n=S.students.length;const pr=S.att.filter(a=>a.date==t&&a.status!='absent').length,ab=S.att.filter(a=>a.date==t&&a.status=='absent').length;
  const lastHw=S.hw.filter(h=>h.due<=t).sort((a,b)=>b.due.localeCompare(a.due))[0];
  const subm=lastHw?S.students.filter(s=>{const x=sub(s.id,lastHw.id);return x&&x.status!='missing'}).length:0;
  const lastEx=S.exams.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  const exs=lastEx?S.examScores.filter(x=>x.eid==lastEx.id):[];const exAvg=exs.length?Math.round(exs.reduce((s,x)=>s+x.score/lastEx.max*100,0)/exs.length):0;
  const top=S.students.map(s=>({s,x:xp(s.id)})).sort((a,b)=>b.x-a.x).slice(0,3);
  const att=S.students.map(s=>({s,n:needs(s.id)})).filter(x=>x.n.length);
  const log=S.log.slice(-6).reverse();
  return `<div class="grid"><div class="stat"><b>${n}</b><span>عدد الطلاب</span></div><div class="stat"><b style="color:var(--ok)">${pr}</b><span>حاضرون اليوم</span></div><div class="stat"><b style="color:var(--bad)">${ab}</b><span>غائبون اليوم</span></div>
  <div class="stat"><b>${subm}/${n}</b><span>${lastHw?esc(lastHw.title):'لا واجبات'}</span></div><div class="stat"><b>${exAvg}%</b><span>متوسط ${lastEx?esc(lastEx.title):'الامتحانات'}</span></div></div>
  ${pr+ab==0?'<p class="muted small">لم يُسجَّل حضور اليوم بعد. افتح «مسح الباركود» للبدء.</p>':''}
  <div class="card"><h3>نسبة الحضور بالمجموعات</h3><div class="bars">${S.groups.map(g=>{const ids=S.students.filter(s=>s.gid==g.id);const v=ids.length?Math.round(ids.reduce((a,s)=>a+attStats(s.id).pct,0)/ids.length):0;return meter(esc(g.name),v)}).join('')}</div></div>
  <div class="card"><h3>طلاب يحتاجون متابعة</h3>${att.length?att.map(x=>`<button class="item" data-act="open" data-arg="${x.s.id}">${av(x.s)}<div class="grow"><b><span style="color:var(--bad);vertical-align:-3px">${ic('alert',18)}</span> ${esc(x.s.name)}</b><div class="small muted">${x.n.map(esc).join(' • ')}</div></div></button>`).join(''):'<p class="muted">لا أحد حاليًا. عمل ممتاز.</p>'}</div>
  <div class="card"><h3>أفضل الطلاب</h3>${top.map((x,i)=>`<button class="item" data-act="open" data-arg="${x.s.id}"><b style="color:${['#c99a2e','#8a97ab','#b0703c'][i]}">${ic('award',26)}</b>${av(x.s)}<div class="grow">${esc(x.s.name)}</div><b>${x.x} XP</b></button>`).join('')}</div>
  <div class="card"><h3>آخر النشاطات</h3>${log.length?log.map(l=>`<div class="small" style="padding:4px 0">${esc(l.time)} — ${esc(l.by)} سجّل ${esc(l.action)} لـ ${esc(l.name)}</div>`).join(''):'<p class="muted">لا نشاط مسجّل بعد.</p>'}</div>`;
};

function profile(sid,embedded){
  const s=st(sid);if(!s)return '';
  const a=attStats(sid),h=hwStats(sid),e=examStats(sid),x=xp(sid),L=lvl(x),t=staff();
  const ev=[];
  S.att.filter(z=>z.sid==sid).forEach(z=>ev.push({d:z.date,t:'الحضور: '+ATT[z.status][0],k:ATT[z.status][1]}));
  S.hwSub.filter(z=>z.sid==sid).forEach(z=>{const hw=S.hw.find(y=>y.id==z.hid);if(hw)ev.push({d:hw.due,t:esc(hw.title)+': '+HW[z.status][0],k:HW[z.status][1]})});
  e.list.forEach(z=>ev.push({d:z.e.date,t:esc(z.e.title)+': '+z.score+'/'+z.e.max,k:z.pct>=75?'ok':'warn'}));
  S.quizRes.filter(z=>z.sid==sid).forEach(z=>{const q=S.quizzes.find(y=>y.id==z.qid);ev.push({d:z.date,t:'لعبة «'+esc(q?q.title:'')+'»: '+(z.score!=null?z.score+'/'+z.total+' ('+z.pct+'%)':z.pct+'%'),k:z.pct>=75?'ok':'warn'})});
  ev.sort((p,q)=>q.d.localeCompare(p.d));
  const nd=needs(sid);
  const attRows=S.att.filter(z=>z.sid==sid).sort((p,q)=>q.date.localeCompare(p.date));
  return `${embedded?'':back}
  <div class="card"><div class="row">${av(s,'lg')}<div class="grow"><h2 style="margin:0">${esc(s.name)}</h2><div class="muted">${esc(gname(grp(s.gid)))} • كود ${esc(s.code)}</div><div class="small">${L[0]} المستوى ${L[1]}</div></div><div class="qr">${qrSvg(s)}</div></div>
  ${nd.length?`<p style="margin:10px 0 0"><span class="chip bad">يحتاج متابعة</span> <span class="small">${nd.map(esc).join(' • ')}</span></p>`:''}</div>
  ${!embedded&&t?infoCard(s):''}
  <div class="grid"><div class="stat"><b>${a.pct}%</b><span>الحضور</span></div><div class="stat"><b>${h.pct}%</b><span>الواجبات</span></div><div class="stat"><b>${e.pct}%</b><span>متوسط الامتحانات</span></div><div class="stat"><b>${x}</b><span>نقاط الخبرة</span></div></div>
  ${embedded?feed(sid):`<div class="card"><h3>السجل الزمني</h3>${ev.length?`<ul class="tl">${ev.slice(0,10).map(z=>`<li><span class="d">${fd(z.d)}</span><span class="dot ${z.k}"></span><span>${z.t}</span></li>`).join('')}</ul>`:'<p class="muted">لا نشاط بعد.</p>'}</div>`}
  <div class="card"><details><summary>سجل الحضور (${attRows.length})</summary>${attRows.map(z=>`<div class="row sp small" style="padding:4px 0"><span>${fd(z.date)}</span><span class="chip ${ATT[z.status][1]}">${ATT[z.status][0]}</span></div>`).join('')||'<p class="muted">لا سجل.</p>'}</details>
  <details><summary>الواجبات</summary>${hwFor(sid).map(w=>{const z=sub(sid,w.id);const past=w.due<=today();return `<div class="row sp small" style="padding:4px 0"><span>${esc(w.title)} — ${fd(w.due)}</span>${z?`<span class="chip ${HW[z.status][1]}">${HW[z.status][0]}</span>`:`<span class="chip ${past?'bad':''}">${past?'لم يحل':'قادم'}</span>`}</div>`}).join('')}</details>
  <details><summary>الامتحانات</summary>${e.list.map(z=>`<div class="row sp small" style="padding:4px 0"><span>${esc(z.e.title)}</span><b>${z.score}/${z.e.max} (${z.pct}%)</b></div>`).join('')||'<p class="muted">لا امتحانات.</p>'}</details></div>
  ${!embedded&&t?`<div class="card"><div class="row"><button class="btn sm" data-act="editStudent" data-arg="${s.id}">تعديل البيانات</button><button class="btn sm" data-act="exportStudent" data-arg="${s.id}">تصدير التقرير (جدول بيانات)</button><button class="btn sm" data-act="msgTo" data-arg="p:${s.id}">مراسلة ولي الأمر</button>
  ${me().role!='teacher'?'':U.del==s.id?`<span class="small">تأكيد الحذف النهائي؟</span><button class="btn sm bad" data-act="delStudent" data-arg="${s.id}">نعم، احذف</button><button class="btn sm" data-act="delAsk" data-arg="">إلغاء</button>`:`<button class="btn sm bad" data-act="delAsk" data-arg="${s.id}">حذف الطالب</button>`}</div>
  <p class="small muted" style="margin:8px 0 0">يوزر الطالب: <b dir="ltr">${esc(suser(s))}</b> • يوزر ولي الأمر: <b dir="ltr">${esc(puser(s))}</b><br>هاتف الطالب: ${esc(s.phone||'—')} • هاتف ولي الأمر: ${esc(s.parentPhone||'—')}${s.pwd||s.ppwd?'<br><span class="chip warn">كلمة المرور ما زالت الافتراضية، غيّرها من تعديل البيانات</span>':''}</p></div>`:''}`;
}

/* scanner */
function hwOptions(sid){return hwFor(sid).sort((a,b)=>b.due.localeCompare(a.due))}
function openScan(sid){const s=st(sid);const t=today();const ar=S.att.find(x=>x.sid==sid&&x.date==t);
  const hws=hwOptions(sid);const past=hws.find(h=>h.due<=t)||hws[0];const hid=past?past.id:'';
  const ex=S.exams.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
  U.sc={sid,att:ar?ar.status:null,hid,hw:null,eid:ex?ex.id:'',score:''};syncHw();syncExam();render()}
function syncHw(){const c=U.sc;if(!c)return;const z=sub(c.sid,c.hid);c.hw=z?z.status:null}
function syncExam(){const c=U.sc;if(!c)return;const z=S.examScores.find(x=>x.sid==c.sid&&x.eid==c.eid);c.score=z?String(z.score):''}
function findByCode(txt){const c=String(txt).replace(/^STU:/i,'').trim();return S.students.find(s=>s.code==c)}
V.scan=()=>{
  const c=U.sc;const s=c?st(c.sid):null;
  const cam=`<div class="cam">${U.cam?'<video id="cam" playsinline muted></video>':'<div class="center" style="padding:20px"><p>وجّه الكاميرا نحو كود الطالب</p><button class="btn pri" data-act="camOn">تشغيل الكاميرا</button></div>'}</div>
  ${U.cam?'<button class="btn sm" data-act="camOff" style="margin-bottom:10px">إيقاف الكاميرا</button>':''}
  <div class="row"><input type="text" id="manual" class="grow" placeholder="أو اكتب كود الطالب (مثال 1025)" inputmode="numeric" data-bind="manual"><button class="btn pri" data-act="manual">بحث</button></div>`;
  let card='';
  if(s){
    const hws=hwOptions(s.id),exs=S.exams;const ex=exs.find(e=>e.id==c.eid);
    card=`<div class="ticket" style="--cut:96px"><div class="top">${av(s,'lg')}<div class="grow"><h3 style="margin:0">${esc(s.name)}</h3><div class="muted">${esc(grp(s.gid)?.name||'')} • رقم الطالب ${esc(s.code)}</div></div></div>

/* quizzes */
V.quizzes=()=>`<div class="row sp" style="margin-bottom:10px"><h2 style="margin:0">الألعاب والاختبارات</h2><button class="btn pri sm" data-act="newQuiz">+ لعبة جديدة</button></div>
  <div class="card">${S.quizzes.map(q=>{const r=S.quizRes.filter(x=>x.qid==q.id);const avg=r.length?Math.round(r.reduce((a,x)=>a+x.pct,0)/r.length):null;return `<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${esc(q.title)}</b><div class="small muted">${q.qs.length} أسئلة • ${r.length} محاولة${avg!=null?' • متوسط '+avg+'%':''}</div></div><div class="row"><button class="btn sm" data-act="play" data-arg="${q.id}">تجربة</button><button class="btn sm bad" data-act="delQuiz" data-arg="${q.id}">حذف</button></div></div>`}).join('')||'<p class="muted">لا ألعاب بعد.</p>'}</div>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizPage(){
  const z=U.quiz,qz=S.quizzes.find(x=>x.id==z.id);if(!qz)return back;const n=qz.qs.length;
  if(z.done){const pct=Math.round(z.score/n*100),stu=me().role=='student',gain=z.first?10+(pct>=90?10:0):0;
    const k=pct>=90?['ممتاز! أداء رائع','ok']:pct>=75?['جيد جدًا، استمر','ok']:pct>=50?['جيد، حاول مرة أخرى لتتحسن','warn']:['تحتاج إلى مراجعة الدرس','bad'];
    const cl=['#1553c7','#2f7bff','#1f8a5b','#b7822e','#d13a4a','#5b6b82'];
    const cf=pct>=75?Array.from({length:40},(_,i)=>`<i style="left:${Math.round(Math.random()*100)}%;--d:${(Math.random()*1.2).toFixed(2)}s;--t:${(2.2+Math.random()*1.6).toFixed(2)}s;--c:${cl[i%6]};--r:${Math.round(Math.random()*360)}deg"></i>`).join(''):'';
    const miss=(z.miss||[]).map(i=>{const q=qz.qs[i];return `<div class="qm"><b>${bd(q.q)}</b><div class="small"><span class="muted">الإجابة الصحيحة:</span> ${bd(q.opts[q.a])}${(z.mp&&z.mp[i]!=null&&q.opts[z.mp[i]])?' · <span class="muted">إجابتك:</span> '+bd(q.opts[z.mp[i]]):''}</div></div>`}).join('');
    return `${back}<div class="qres"><div class="qrh ${k[1]}">${cf?`<div class="cf" aria-hidden="true">${cf}</div>`:''}<h2>${esc(qz.title)}</h2><div class="ring lg qring" style="--p:${pct}"><div><b class="cu">${pct}%</b></div></div><div class="qmsg">${k[0]}</div></div>
    <div class="qst"><div><b class="cu">${z.score}</b><span>إجابة صحيحة</span></div><div><b class="cu">${n-z.score}</b><span>إجابة خاطئة</span></div>${stu?(z.first?`<div class="gain"><b>+${gain}</b><span>نقطة خبرة</span></div>`:`<div class="gain"><b>0</b><span>نقطة خبرة</span></div>`):''}</div>${stu&&z.attempt?`<p class="muted small center" style="margin:10px 0 0">المحاولة رقم ${z.attempt}: ${z.score} من ${n}${z.first?'':' · النقاط تُحتسب من أول محاولة فقط'}</p>`:''}
    ${miss?`<div class="qmiss"><h3>الأسئلة التي أخطأت فيها</h3>${miss}</div>`:''}
    <div class="qact"><button class="btn pri" data-act="play" data-arg="${qz.id}">إعادة اللعبة</button><button class="btn" data-act="quizExit">رجوع</button></div>${stu?'':'<p class="muted small qnote">تجربة فقط، لم تُسجَّل النتيجة.</p>'}</div>`}
  const q=qz.qs[z.i],ord=z.ord[z.i];
  const fresh=z.shown!==z.i;z.shown=z.i;const v=z.i%6,AL=['أ','ب','ج','د'];
  return `${back}<div class="qx qv${v}${fresh?' fresh':''}${z.picked!=null?' done':''}"><div class="qhead"><div class="qmeta"><span class="qnum">${z.i+1}</span><span class="small">سؤال ${z.i+1} من ${n}</span></div><div class="qprog"><i style="width:${(z.i+(z.picked!=null?1:0))/n*100}%"></i></div><h3 class="qtext">${bd(q.q)}</h3></div>
  <div class="qopts">${ord.map((j,k)=>{let c='';if(z.picked!=null){if(j==q.a)c=' good';else if(j==z.picked)c=' wrong'}return `<button class="qopt opt${c}" style="--i:${k}" data-act="qpick" data-arg="${j}"><span class="ql">${AL[k]||k+1}</span><span class="grow">${bd(q.opts[j])}</span></button>`}).join('')}</div>
  <div class="qfoot">${z.picked!=null?`<div class="qfb ${z.picked==q.a?'ok':'bad'}">${z.picked==q.a?'إجابة صحيحة!':'<span>الإجابة الصحيحة:</span> '+bd(q.opts[q.a])}</div>`:''}${z.picked!=null?`<button class="btn pri" data-act="qnext">${z.i+1<n?'السؤال التالي':'إنهاء'}</button>`:''}<button class="btn sm" data-act="quizExit">خروج</button></div></div>`;
}

/* student home / board / settings */
function statusTiles(sid){
  const t=today();const ar=S.att.find(x=>x.sid==sid&&x.date==t);
  const last=S.att.filter(x=>x.sid==sid).sort((p,q)=>q.date.localeCompare(p.date))[0];const a=ar||last;
  const AI={present:'check',late:'clock',absent:'x'},HI={done:'check',missing:'x',partial:'alert',late:'clock'};
  const tile=(k,i,lab,val,sb)=>`<div class="tile ${k}"><span class="ico">${ic(i,20)}</span><small>${lab}</small><b>${val}</b><em>${esc(sb)}</em></div>`;
  const at=a?tile(ATT[a.status][1],AI[a.status],'الحضور',ATT[a.status][0],ar?'حصة اليوم':'آخر حصة · '+fd(a.date)):tile('none','minus','الحضور','لا تسجيل','لم يُسجَّل بعد');
  const hw=hwFor(sid).filter(h=>h.due<=t).sort((x,y)=>y.due.localeCompare(x.due))[0];
  const z=hw?sub(sid,hw.id):null,k=hw?(z?z.status:'missing'):null;
  const ht=hw?tile(HW[k][1],HI[k],'الواجب',HW[k][0],hw.title):tile('none','pen','الواجب','لا واجبات','لا يوجد مطلوب');
  return `<div class="stt">${at}${ht}</div>`}
const nkind=t=>/✅|سلّم/.test(t)?'ok':/🔔/.test(t)?'bad':/⏰/.test(t)?'warn':'';
const NEMO={'✅':'check','🔔':'bell','⏰':'clock','📝':'pen','🏆':'trophy','🎥':'play','📄':'doc','💬':'chat'};
const nIco=t=>NEMO[[...String(t)][0]]||'bell';
const nTxt=t=>String(t).replace(/^(✅|🔔|⏰|📝|🏆|🎥|📄|💬)\s*/,'');

  ${par&&nd.length?`<div class="alert bad"><div><b>يحتاج متابعة</b><div class="small">${nd.map(esc).join(' • ')}</div></div></div>`:''}
  <div class="hub${par?' h3':''}">
    ${par?'':btn('c1','lessons','book','الحصص',l0?esc(l0.title):'لا توجد حصص بعد')}
    ${btn('c2','exams','doc','الامتحانات',ex?esc(ex.e.title)+' · '+ex.score+'/'+ex.e.max:'لا توجد درجات بعد')}
    ${btn('c3','hw','pen','الواجبات',nh?'القادم: '+esc(nh.title)+' · '+dleft(nh.due):'لا يوجد واجب قادم')}
    ${btn('c4','att','qr','الحضور',a.n?'نسبة الحضور '+a.pct+'%'+(ar?' · اليوم: '+ATT[ar.status][0]:''):'بطاقة الطالب')}
  </div>
  <div class="sub2">${par?`<button class="btn" data-act="tab" data-arg="notifs">الإشعارات</button><button class="btn pri" data-act="msgTo" data-arg="p:${s.id}">تواصل مع المدرس</button>`:`<button class="btn" data-act="tab" data-arg="board">المتصدرون</button><button class="btn pri" data-act="msgTo" data-arg="s:${s.id}">اسأل المدرس</button>`}</div>`;

let stream=null,timer=null;
function render(){

  if(S.me.role=='assistant'&&!(S.assistants||[]).some(a=>a.id==S.me.aid)){S.me=null;save();return render()}
  const tabs=TABS[S.me.role];if(!tabs.some(t=>t[0]==U.tab))U.tab=tabs[0][0];
  if(U.tab!='scan')stopCam();
  let body;
  try{body=U.quiz?quizPage():U.detail?profile(U.detail):U.lessonId?lessonPage(U.lessonId):V[U.tab]()}catch(e){console.error(e);body='<div class="card">تعذر عرض هذه الصفحة.</div>'}
  if(!U.detail&&!U.lessonId&&!U.quiz&&U.tab!=tabs[0][0]&&!/data-act="back"/.test(body))body=back+body;
  const who=S.me.sid?st(S.me.sid):null;const lux=S.me.role=='student'||S.me.role=='parent';document.body.classList.toggle('lux',lux);document.body.classList.toggle('tch',!lux);setDir(LANG);body=lux?tr(body.replace(EMO,'')):body;
  app.innerHTML=tr(creditBar()+(lux?luxShell(tabs,body,who)+zoomView():`${tShell(tabs,body)}${U.modal?`<div class="ov"><div class="sheet" role="dialog" aria-modal="true">${modalView()}</div></div>`:''}`));
  hydrateVideo();pgEnter();
  if(stream){const v=$('#cam');if(v&&v.srcObject!==stream){v.srcObject=stream;v.play().catch(()=>{})}}
  if(aid){const n=document.getElementById(aid);if(n&&n!==document.activeElement){n.focus();try{if(sel)n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
/* حركة الأرقام + دخول الصفحات */
function countUps(root){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  root.querySelectorAll('.ring b,.stat b,.sc,.mini3 b,.cu').forEach(el=>{
    const n=[...el.childNodes].find(x=>x.nodeType==3&&/^\s*-?\d+(\.\d+)?%?\s*$/.test(x.nodeValue));if(!n)return;
    const m=n.nodeValue.trim().match(/^(-?\d+(?:\.\d+)?)(%?)$/),to=parseFloat(m[1]),suf=m[2],dec=(m[1].split('.')[1]||'').length;
    if(!isFinite(to)||Math.abs(to)>100000)return;
    const t0=performance.now(),D=900+Math.min(600,Math.abs(to)*4);
    const step=t=>{if(!n.isConnected)return;const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);n.nodeValue=p<1?(to*e).toFixed(dec)+suf:m[1]+suf;if(p<1)requestAnimationFrame(step)};
    n.nodeValue='0'+suf;requestAnimationFrame(step)})}
function pgEnter(){
  const k=[S.me&&S.me.role,U.tab,U.detail,U.lessonId,U.quiz&&(U.quiz.id+(U.quiz.done?'D':''))].join('|');
  if(k===U._vk)return;U._vk=k;
  const mn=document.querySelector('main.wrap');if(!mn)return;mn.classList.add('enter');countUps(mn)}
/* camera */
async function camOn(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});U.cam=true;clearInterval(timer);timer=setInterval(tick,300);render()}catch(e){toast('تعذر تشغيل الكاميرا. استخدم إدخال الكود يدويًا.')}}
function stopCam(){clearInterval(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}U.cam=false}
function tick(){const v=$('#cam');if(!stream||!v||v.readyState<2||!window.jsQR||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height);if(r&&r.data){const s=findByCode(r.data);if(s&&(!U.sc||U.sc.sid!=s.id)){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}openScan(s.id)}}}

/* csv */
async function csv(name,table){let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('التصدير غير متاح في هذا العرض');return}
  const data='\ufeff'+table.map(r=>r.map(c=>'"'+(LANG=='en'&&isNaN(c)?tr1(String(c)):String(c)).replace(/"/g,'""')+'"').join(',')).join('\n');
  try{await dl.save({filename:name,data});toast('تم التصدير')}catch(e){if(!e||e.code!='declined')toast('تعذر التصدير')}}

function imgToData(file,maxW=1200,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,maxW/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

  if(U.modal){U.modal=null;return true}
  if(U.quiz){U.quiz=null;return true}

  if(U.detail){U.detail=null;return true}

}

/* ===== device video storage (IndexedDB) + protected player ===== */
function vdb(){return new Promise((res,rej)=>{const r=indexedDB.open('stp_videos',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function vput(k,f){const d=await vdb();return new Promise((res,rej)=>{const t=d.transaction('v','readwrite');t.objectStore('v').put(f,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function vget(k){const d=await vdb();return new Promise((res,rej)=>{const q=d.transaction('v').objectStore('v').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function vdel(k){try{const d=await vdb();d.transaction('v','readwrite').objectStore('v').delete(k)}catch(e){}}
function playerHtml(l){const m=me();const code=m.sid&&st(m.sid)?st(m.sid).code:'المدرس';
  return `<div class="vwrap" data-vf="${esc(l.vfile)}"><video controls controlsList="nodownload nofullscreen noremoteplayback" disablePictureInPicture playsinline oncontextmenu="return false"></video><div class="vmsg">جاري تحميل الفيديو...</div><div class="wm">${esc(code)}</div><button class="vfs" data-act="vfs" type="button">⛶</button></div>`}
var wmT;
async function hydrateVideo(){clearInterval(wmT);clearTimeout(wmT);const w=document.querySelector('.vwrap');if(!w)return;
  const v=w.querySelector('video'),m=w.querySelector('.wm'),g=w.querySelector('.vmsg');
  try{const b=await vget(w.dataset.vf);if(!b){g.textContent='الفيديو غير موجود على هذا الجهاز. ارفعه من جديد من نفس الجهاز.';return}v.src=URL.createObjectURL(b);g.remove()}catch(e){g.textContent='تعذر تشغيل الفيديو';return}
  let lx=-1,ly=-1;
  const mv=()=>{const r=w.getBoundingClientRect(),mw=Math.max(0,r.width-m.offsetWidth-8),mh=Math.max(0,r.height-m.offsetHeight-48);let x,y,n=0;
    do{x=Math.random()*mw;y=Math.random()*mh;n++}while(n<12&&lx>=0&&Math.abs(x-lx)<mw*.3&&Math.abs(y-ly)<mh*.3);
    lx=x;ly=y;m.style.left=x+'px';m.style.top=y+'px'};
  /* يثبت في مكانه فترة، يختفي، ثم يظهر في مكان مختلف */
  m.style.transition='opacity .6s ease';m.style.opacity='1';
  const cycle=()=>{m.style.opacity='0';wmT=setTimeout(()=>{mv();m.style.opacity='1';wmT=setTimeout(cycle,9000)},2500)};
  mv();wmT=setTimeout(cycle,9000);
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>w.addEventListener(ev,()=>{m.style.transition='none';mv();setTimeout(()=>m.style.transition='opacity .6s ease',60)}))}

const MAXPDF=25*1024*1024;
const isPdf=f=>f&&(f.type=='application/pdf'||/\.pdf$/i.test(f.name||''));
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round((n||0)/1024))+' KB';
const KIND={notes:['مذكرة','ok'],sol:['حل','warn']};
/* الحل يظهر للطالب: لو المدرس اختار صراحة، أو تلقائيًا بعد انتهاء يوم تسليم الواجب */
const solVisible=(l,f)=>{

    else acts+='<span class="chip">يُتاح بعد موعد التسليم</span>';
    if(t){
      if(f.kind=='sol')acts+=`<button class="btn sm" data-act="pfRel" data-arg="${key}">${vis?'إخفاء عن الطلاب':'إتاحة الآن'}</button>`;
      acts+=U.pfAsk==key
        ?`<button class="btn sm bad" data-act="pfDel" data-arg="${key}">تأكيد الحذف</button><button class="btn sm" data-act="pfAskNo">إلغاء</button>`
        :`<button class="btn sm bad" data-act="pfAsk" data-arg="${key}">حذف</button>`;
    }
    return `<div class="pfr"><span class="fi ${k[1]}">${ic('doc',20)}</span><div class="grow"><b>${esc(f.name)}</b><div class="small muted"><span class="chip ${k[1]}">${k[0]}</span> ${fsize(f.size)}${t&&f.kind=='sol'?' · '+(vis?'ظاهر للطلاب':'مخفي عن الطلاب'):''}</div></div><div class="pfa">${acts}</div></div>`;
  }).join('');
  const add=t?`<div style="${fs.length?'margin-top:14px;padding-top:6px;border-top:1px solid var(--line)':''}"><label style="margin-top:6px">إضافة ملف بي دي إف</label><div class="row" style="flex-wrap:nowrap"><select id="pfkind" style="width:auto;flex:none"><option value="notes">مذكرة</option><option value="sol">حل</option></select><input type="file" id="pffile" accept="application/pdf,.pdf" multiple style="min-width:0"></div><div class="small muted" style="margin-top:6px">الحل يظهر للطلاب تلقائيًا بعد موعد تسليم الواجب، ولك أن تتيحه قبلها.</div></div>`:'';

async function addFiles(l,kind,files){
  const added=[];l.files=l.files||[];
  for(const f of files){
    if(!isPdf(f)){toast('«'+f.name+'» ليس ملف بي دي إف');continue}
    if(f.size>MAXPDF){toast('«'+f.name+'» أكبر من 25 ميجابايت');continue}
    const id=uid('f');
    try{await vput('f'+id,f)}catch(e){toast('تعذر حفظ الملف (المساحة لا تكفي)');break}
    const rec={id,name:f.name,kind,size:f.size};
    l.files.push(rec);added.push(rec);
  }
  return added;
}
function notifyFiles(l,recs){
  const ts=S.students.filter(s=>inT(s,l.gid));
  recs.forEach(f=>{
    if(!solVisible(l,f))return;
    ts.forEach(s=>notify(s.id,(f.kind=='sol'?'📄 تم رفع حل: ':'📄 تمت إضافة مذكرة: ')+f.name+' — '+l.title));
  });
}
async function stampPdf(buf,code){
  if(!window.PDFLib)throw new Error('lib');
  const {PDFDocument,StandardFonts,rgb,degrees}=PDFLib;
  const doc=await PDFDocument.load(buf,{ignoreEncryption:true});
  const font=await doc.embedFont(StandardFonts.HelveticaBold);
  const txt='ID '+code,A=35*Math.PI/180,ux=Math.cos(A),uy=Math.sin(A);
  doc.getPages().forEach(pg=>{
    const {width:W,height:Hh}=pg.getSize(),size=Math.max(20,Math.min(W,Hh)/15),tw=font.widthOfTextAtSize(txt,size);
    const sx=tw+size*3,sy=size*5,N=Math.ceil(Math.hypot(W,Hh)/Math.min(sx,sy))+1;
    for(let i=-N;i<=N;i++)for(let j=-N;j<=N;j++){
      const x=W/2+i*sx*ux-j*sy*uy,y=Hh/2+i*sx*uy+j*sy*ux;
      if(x<-tw||x>W+tw||y<-tw||y>Hh+tw)continue;
      pg.drawText(txt,{x,y,size,font,color:rgb(.45,.45,.45),opacity:.13,rotate:degrees(35)});
    }
    pg.drawText(txt+' - MR.ADAM',{x:18,y:12,size:8,font,color:rgb(.3,.3,.3),opacity:.7});
  });
  return await doc.save();
}
let PVDOC=null;
function pdfClose(){const e=document.getElementById('pdfv');if(e)e.remove();document.body.style.overflow='';if(PVDOC){try{PVDOC.destroy()}catch(x){}PVDOC=null}}
async function pdfView(data,name,canDl,lid,fid){
  pdfClose();
  if(!window.pdfjsLib){toast('تعذر تحميل عارض الملفات — تأكد من الاتصال بالإنترنت');return}
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const box=document.createElement('div');box.id='pdfv';
  box.innerHTML='<div class="pvh"><b class="pvt">'+esc(name)+'</b><div class="pva">'+(canDl?'<button type="button" class="btn sm" id="pvdl">'+ic('download',16)+'<span>تحميل</span></button>':'')+'<button type="button" class="btn sm pri" id="pvx">'+ic('close',16)+'<span>إغلاق</span></button></div></div><div class="pvb" id="pvb"><p class="muted center" style="padding:30px">جاري تحميل الملف...</p></div>';
  document.body.appendChild(box);document.body.style.overflow='hidden';
  box.addEventListener('contextmenu',e=>e.preventDefault());
  box.querySelector('#pvx').onclick=pdfClose;
  if(canDl)box.querySelector('#pvdl').onclick=()=>pfFile(lid,fid,true);
  try{
    const doc=await pdfjsLib.getDocument({data}).promise;PVDOC=doc;
    const body=box.querySelector('#pvb');body.innerHTML='';
    const w=Math.min(body.clientWidth-20,900),dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=doc.numPages;i++){
      if(!document.getElementById('pdfv'))return;
      const pg=await doc.getPage(i),v0=pg.getViewport({scale:1}),sc=w/v0.width,v=pg.getViewport({scale:sc*dpr});
      const c=document.createElement('canvas');c.width=v.width;c.height=v.height;c.style.width=(v.width/dpr)+'px';c.style.height=(v.height/dpr)+'px';
      body.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    }
  }catch(e){console.error(e);pdfClose();toast('تعذر عرض الملف')}
}

async function pfFile(lid,fid,dl){
  const l=S.lessons.find(x=>x.id==lid),f=l&&(l.files||[]).find(x=>x.id==fid);
  if(!f)return;
  if(dl&&!staff()){toast('التحميل متاح للمدرس والمساعد فقط');return}
  if(!staff()&&!solVisible(l,f)){toast('هذا الملف لم يُتح بعد');return}
  try{
    const b=await vget('f'+fid);
    if(!b){toast('الملف غير موجود على هذا الجهاز. ارفعه من جديد من نفس الجهاز.');return}
    let data=await b.arrayBuffer();
    if(!staff()){
      const s=st(me().sid);
      try{data=await stampPdf(data,s?s.code:'')}
      catch(e){toast(e&&e.message=='lib'?'تعذر تحميل مكتبة الحماية — تأكد من الاتصال بالإنترنت':'تعذر تجهيز الملف');return}
    }
    if(dl){const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);return}
    await pdfView(data,f.name,staff(),lid,fid);
  }catch(e){toast('تعذر فتح الملف')}
}

/* ---------------------------------------------------------------
   2) التقرير الشهري (بي دي إف) لولي الأمر
   --------------------------------------------------------------- */
const AR='ar-EG-u-nu-latn';
const MN=ym=>new Date(ym+'-15T12:00:00').toLocaleDateString(LANG=='en'?'en-GB':AR,{month:'long',year:'numeric'});
const curYm=()=>today().slice(0,7);
const prevYm=ym=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const defMonth=()=>+today().slice(8)<=7?prevYm(curYm()):curYm();
const monthOptions=()=>{const a=[];let m=curYm();for(let i=0;i<7;i++){a.push(m);m=prevYm(m)}return a};
const inM=(d,ym)=>String(d).slice(0,7)==ym;
const dm=d=>(+d.slice(8))+'/'+(+d.slice(5,7));

function mcore(sid,ym){
  const s=st(sid),t=today();
  const att=S.att.filter(x=>x.sid==sid&&inM(x.date,ym)&&(!since(sid)||x.date>=since(sid))).sort((a,b)=>a.date.localeCompare(b.date));
  const p=att.filter(x=>x.status=='present').length,l=att.filter(x=>x.status=='late').length,ab=att.filter(x=>x.status=='absent').length;
  const ap=att.length?Math.round((p+l)/att.length*100):null;
  let sum=0;
  const hr=hwFor(sid).filter(h=>inM(h.due,ym)&&h.due<=t).sort((a,b)=>a.due.localeCompare(b.due)).map(h=>{
    const z=sub(sid,h.id),k=z?z.status:'missing';sum+=k=='done'?1:(k=='late'||k=='partial')?.5:0;
    return{t:h.title,due:h.due,max:h.max,k};
  });
  const hp=hr.length?Math.round(sum/hr.length*100):null;
  const ex=S.exams.filter(e=>inT(s,e.gid||'all')&&inM(e.date,ym)&&e.date<=t&&(!since(sid)||e.date>=since(sid))).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
    const z=S.examScores.find(x=>x.sid==sid&&x.eid==e.id);
    const peers=S.examScores.filter(x=>x.eid==e.id&&st(x.sid)&&st(x.sid).gid==s.gid);
    const ca=peers.length?Math.round(peers.reduce((a,x)=>a+x.score/e.max*100,0)/peers.length):null;
    return{t:e.title,date:e.date,max:e.max,score:z?z.score:null,pct:z?Math.round(z.score/e.max*100):null,ca};
  });
  const sc=ex.filter(x=>x.pct!=null);
  const ep=sc.length?Math.round(sc.reduce((a,x)=>a+x.pct,0)/sc.length):null;
  return{att:att.map(x=>({d:x.date,s:x.status})),p,l,ab,ap,hr,hp,ex,ep};
}
function autoNotes(sn){
  const c=sn.c,o=[];
  if(c.ap!=null){
    if(c.ap>=90&&c.ab==0)o.push('الالتزام بالحضور ممتاز هذا الشهر.');
    else if(c.ab>=2)o.push('عدد حصص الغياب هذا الشهر: '+c.ab+'، ونرجو الانتظام في الحضور لتعويض ما فات.');
    else if(c.ap<75)o.push('نسبة الحضور تحتاج إلى تحسّن.');
  }
  if(c.hp!=null){
    if(c.hp>=90)o.push('الالتزام بحل الواجبات وتسليمها في موعدها ممتاز.');
    else if(c.hp<60)o.push('يلزم متابعة أكبر في حل الواجبات وتسليمها في موعدها.');
  }
  if(c.ep!=null){
    if(c.ep>=85)o.push('المستوى في الامتحانات متميز.');
    else if(c.ep<60)o.push('نوصي بمراجعة الدروس السابقة قبل الامتحان القادم.');
  }
  if(sn.dl.ep!=null&&sn.dl.ep>=8)o.push('ارتفع متوسط الامتحانات '+sn.dl.ep+'% عن الشهر الماضي، فاستمروا على هذا النهج.');
  if(sn.dl.ep!=null&&sn.dl.ep<=-8)o.push('انخفض متوسط الامتحانات '+(-sn.dl.ep)+'% عن الشهر الماضي ونحتاج إلى مراجعة الدروس.');
  if(!o.length)o.push('لا توجد بيانات كافية لهذا الشهر بعد.');
  return o;
}
function monthSnap(sid,ym,note){
  const s=st(sid),c=mcore(sid,ym),pv=mcore(sid,prevYm(ym));
  const qs=S.quizRes.filter(q=>q.sid==sid&&inM(q.date,ym));
  const vals=[c.ap,c.hp,c.ep].filter(v=>v!=null);
  const ov=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;
  const x=xp(sid),df=(a,b)=>a!=null&&b!=null?a-b:null;
  const tr=[];let mm=ym;
  for(let i=0;i<6;i++){const k=i==0?c:mcore(sid,mm);tr.unshift({ym:mm,ap:k.ap,hp:k.hp,ep:k.ep});mm=prevYm(mm)}
  const sn={tr,sid,ym,name:s.name,grp:gname(grp(s.gid)),school:s.school||'',code:s.code,c,ov,lvl:lvl(x)[1],xp:x,
    q:{n:qs.length,avg:qs.length?Math.round(qs.reduce((a,z)=>a+z.pct,0)/qs.length):null},
    dl:{ap:df(c.ap,pv.ap),hp:df(c.hp,pv.hp),ep:df(c.ep,pv.ep)},note:note||'',gen:today()};
  sn.auto=autoNotes(sn);
  return sn;
}

async function makePdf(sn){
  if(!window.html2canvas||!window.jspdf)throw new Error('lib');
  const host=document.createElement('div');
  host.id='rphost';host.style.cssText='position:absolute;left:-10000px;top:0;width:794px;background:#fff;pointer-events:none';
  host.innerHTML=reportHtml(sn);document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const root=host.firstElementChild,rt=root.getBoundingClientRect().top;
    const cuts=[...root.querySelectorAll('.rpk')].map(e=>Math.round((e.getBoundingClientRect().bottom-rt)*2)).sort((a,b)=>a-b);
    const cv=await html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,
      onclone:d=>{const h=d.getElementById('rphost');if(h){h.style.left='0';h.style.position='absolute'}}});
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const W=pdf.internal.pageSize.getWidth(),Hh=pdf.internal.pageSize.getHeight();
    const put=(c,x,w,h)=>pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',x,0,w,h);
    let k=W/cv.width;
    if(cv.height*k<=Hh*1.3){
      /* لو زاد المحتوى قليلًا عن صفحة: نصغّره ليبقى في صفحة واحدة */
      if(cv.height*k>Hh){k=Hh/cv.height}
      const w=cv.width*k;put(cv,(W-w)/2,w,cv.height*k);
    }else{
      const ph=Math.floor(Hh/k);let y=0,first=true;
      while(y<cv.height-2){
        let end=Math.min(y+ph,cv.height);
        if(end<cv.height){const ok=cuts.filter(c=>c>y+ph*0.5&&c<=y+ph);if(ok.length)end=ok[ok.length-1]}
        const h=end-y,c2=document.createElement('canvas');
        c2.width=cv.width;c2.height=h;
        const cx=c2.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c2.width,c2.height);
        cx.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
        if(!first)pdf.addPage();
        put(c2,0,W,h*k);first=false;y=end;
      }
    }
    return pdf.output('blob');
  }finally{host.remove()}
}

/* icons defined at top */
const TNI={dash:'grid',follow:'alert',students:'users',years:'layers',scan:'qr',lessons:'book',exams:'doc',quizzes:'trophy',reports:'chart',msgs:'chat',settings:'gear',acct:'key'};
const TNG={dash:0,follow:0,students:1,years:1,scan:1,lessons:2,exams:2,quizzes:2,reports:3,msgs:3,settings:4,acct:4};
const TNGN=['الرئيسية','الطلاب','المحتوى','المتابعة','الحساب'];
function meName(){const m=me();if(m.role=='teacher')return 'المدرس';const a=(S.assistants||[]).find(x=>x.id==m.aid);return (a&&a.name)||'المساعد'}
function tTitle(tabs){if(U.quiz)return 'اللعبة';if(U.lessonId)return 'الدرس';if(U.detail)return 'ملف الطالب';const t=tabs.find(x=>x[0]==U.tab);return t?t[1]:''}
function tShell(tabs,body){
  const isT=me().role=='teacher',nm=meName();
  document.body.classList.toggle('asst',!isT);
  const on=k=>U.tab==k&&!U.detail&&!U.lessonId&&!U.quiz;
  const items=tabs.map(t=>({k:t[0],l:t[1],g:TNG[t[0]]??1})).sort((a,b)=>a.g-b.g);
  let cur=-1,nav='';
  items.forEach(it=>{if(it.g!==cur){cur=it.g;nav+=`<div class="tgl">${TNGN[cur]}</div>`}
    nav+=`<button class="tnv ${on(it.k)?'on':''}" data-act="tab" data-arg="${it.k}">${ic(TNI[it.k]||'doc',20)}<span>${it.l}</span></button>`});
  const date=new Date().toLocaleDateString(LANG=='en'?'en-GB':'ar-EG-u-nu-latn',{weekday:'short',day:'numeric',month:'short'});
  return `<div class="tsh"><aside class="tside"><div class="tbrand"><span class="tmono">${ic('book',22)}</span><div><b dir="ltr">MR.ADAM</b><small>${isT?'لوحة المدرس':'لوحة المساعد'}</small></div></div>
  <nav class="tnav">${nav}</nav>
  <div class="tuser"><span class="tav">${esc((nm||'م')[0])}</span><div class="grow"><b>${esc(nm)}</b><small>${isT?'مدرس':'مساعد'}</small></div><button class="tib" data-act="logout" aria-label="خروج">${ic('logout',18)}</button></div>
  <div class="tcr" dir="ltr">MADE BY ADAM AMR</div></aside>
  <div class="tscrim" data-act="tmenu"></div>
  <div class="tmain"><header class="ttop"><button class="tburger" data-act="tmenu" aria-label="القائمة">${ic('menu',22)}</button><h1 class="ttitle">${tTitle(tabs)}</h1><div class="lsw" role="group" aria-label="اللغة"><button type="button" data-act="setLang" data-arg="ar" class="${LANG=='en'?'':'on'}" aria-pressed="${LANG!='en'}">العربية</button><button type="button" data-act="setLang" data-arg="en" class="${LANG=='en'?'on':''}" aria-pressed="${LANG=='en'}">English</button></div><span class="tdate">${esc(date)}</span></header><main class="wrap">${body}</main></div></div>`;
}

/* لوحة التحكم: ترحيب + أيقونات للأرقام */
const _dash0=V.dash;
V.dash=()=>{
  let h=_dash0(),i=0;
  const I=['users','check','x','pen','doc'],K=['','ok','bad','warn',''];
  h=h.replace(/<div class="stat">/g,()=>{const k=i++;return `<div class="stat"><span class="sic ${K[k]||''}">${ic(I[k]||'doc',20)}</span>`});
  const n=S.students.length,hr=new Date().getHours();
  const d=new Date().toLocaleDateString(LANG=='en'?'en-GB':'ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  const hero=`<section class="thero"><div><span class="eyebrow">${hr<12?'صباح الخير':'مساء الخير'}</span><h2>لوحة التحكم</h2><p>${esc(d)} · ${n} طالب · ${S.groups.length} مجموعة</p></div><div class="tquick"><button class="btn pri" data-act="tab" data-arg="scan">${ic('qr',18)}<span>مسح الباركود</span></button><button class="btn" data-act="newStudent">${ic('plus',18)}<span>طالب جديد</span></button><button class="btn" data-act="newLesson">${ic('plus',18)}<span>درس جديد</span></button></div></section>`;
  return hero+h;
};

  const row=a=>`<div class="asr"><span class="tav2">${esc((a.name||'؟')[0])}</span><div class="grow"><b>${esc(a.name)}</b><div class="small muted" dir="ltr" style="text-align:start">${esc(a.user)}</div>${a.d?'<span class="chip warn">كلمة مرور افتراضية</span>':''}</div>
